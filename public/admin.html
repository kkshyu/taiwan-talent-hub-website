<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>後台管理 · 言文字｜台灣人才聚落</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  /* 後台：Data-Dense Dashboard × Swiss 極簡。沿用 CIS token（/style.css）；資訊密度優先、動效克制 */
  :root{--a-side:240px;--a-top:56px;--a-r:8px}
  html{background:var(--paper)}
  body{font-family:var(--sans);font-size:13.5px;line-height:1.5;color:var(--ink);background:var(--paper);min-height:100vh}
  *,*::before,*::after{box-sizing:border-box}
  ::selection{background:var(--accent-soft)}
  :focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  /* 頂欄 56px */
  .a-top{position:fixed;top:0;left:0;right:0;height:var(--a-top);background:var(--card);border-bottom:1px solid var(--line);z-index:30;display:flex;align-items:center;padding:0 16px 0 20px;gap:12px}
  .a-brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;width:calc(var(--a-side) - 20px);flex:none}
  .a-brand i{width:28px;height:28px;border-radius:6px;background:var(--ink);color:var(--accent);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-style:normal;font-size:15px;flex:none}
  .a-brand b{font-weight:600;font-size:14px}
  .a-brand span{color:var(--muted);font-size:12px}
  .a-crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .a-crumb b{color:var(--ink);font-weight:600;font-size:14px}
  .a-role{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-weight:500}
  .a-top-act{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}

  /* 側欄 240px：分組導覽 */
  .a-nav{position:fixed;top:var(--a-top);left:0;bottom:0;width:var(--a-side);background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:14px 10px 16px;display:flex;flex-direction:column;gap:16px;z-index:20}
  .a-nav-g{display:flex;flex-direction:column;gap:2px}
  .a-nav-gl{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:0 10px 6px;font-weight:500}
  .a-nav button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;height:36px;padding:0 10px;border-radius:6px;color:var(--ink-soft);font-size:13.5px;display:flex;align-items:center;gap:10px;transition:background .15s,color .15s}
  .a-nav button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
  .a-nav button .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .a-nav button:hover{background:var(--paper-alt);color:var(--ink)}
  .a-nav button:focus-visible{outline-offset:-2px}
  .a-nav button.on{background:var(--ink);color:var(--paper);font-weight:500}
  .a-nav button.on svg{opacity:1}
  .a-nav .badge{font-size:11px;line-height:1;background:var(--accent);color:var(--ink);border-radius:999px;padding:3px 7px;font-weight:600;font-variant-numeric:tabular-nums}
  .a-nav-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
  .a-nav-foot b{display:block;color:var(--ink-soft);font-weight:500}

  /* 內容區 */
  .a-main{margin-left:var(--a-side);padding:calc(var(--a-top) + 20px) 24px 60px;min-width:0;max-width:1480px}
  .a-tab{display:none}.a-tab.on{display:block;animation:fade .15s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .a-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .a-kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--a-r);padding:12px 14px}
  .a-kpi .kl{color:var(--muted);font-size:11.5px;letter-spacing:.04em}
  .a-kpi .kv{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.25}
  .a-kpi .kv .u{font-size:12px;color:var(--muted);font-weight:400;margin-right:.15em}
  .a-sec{background:var(--card);border:1px solid var(--line);border-radius:var(--a-r);padding:16px 18px;margin-bottom:14px}
  .a-sec h2{font-size:15px;font-weight:600;margin:0 0 .25rem;display:flex;align-items:center;gap:.5em}
  .a-sec h3{font-size:13.5px;font-weight:600}
  .a-sec .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px;line-height:1.55}
  .a-h1{font-size:18px;font-weight:600;margin-bottom:.25em}
  h1,h2,h3,.a-h1,.a-sec h2,.a-sec h3,.sp-h3,.application-card h3{font-family:var(--sans);letter-spacing:0}
  .a-sub{color:var(--muted);margin-bottom:1rem;font-size:12.5px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--paper-alt);padding:.1em .35em;border-radius:4px}
  .a-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  .a-empty{color:var(--muted);padding:14px 10px}
  .a-center{text-align:center;padding:60px 0;color:var(--muted)}
  .a-regs{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}

  /* 表格：36px 列高、黏性表頭、hover 列、右對齊數字 */
  .a-wrap2{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:6px}
  table.a-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  table.a-tbl th{position:sticky;top:0;z-index:1;background:var(--paper-alt);text-align:left;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.05em;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.a-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.45}
  table.a-tbl tbody tr:last-child td{border-bottom:0}
  table.a-tbl tbody tr:hover td{background:var(--paper)}
  table.a-tbl td.num,table.a-tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.a-tbl a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
  table.a-tbl a:hover{text-decoration-color:var(--ink)}

  /* 表單／工具列 */
  .a-form{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:12px}
  .a-form label,.sp-page-form label,.xs-form label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .a-form input,.a-form select,.a-form textarea,.a-toolbar input,.a-toolbar select,
  .sp-page-form input,.sp-page-form select,.sp-page-form textarea,.xs-form input,.xs-form textarea,#social-body select{
    font:inherit;font-size:13.5px;padding:6px 10px;min-height:34px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);transition:border-color .15s,box-shadow .15s}
  .a-form input:focus,.a-form select:focus,.a-form textarea:focus,.a-toolbar input:focus,.a-toolbar select:focus,
  .sp-page-form input:focus,.sp-page-form select:focus,.sp-page-form textarea:focus,.xs-form input:focus,.xs-form textarea:focus,#social-body select:focus{
    outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
  .a-form input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--ink)}
  .a-form textarea,.sp-page-form textarea,.xs-form textarea{width:100%;min-height:64px;resize:vertical;line-height:1.5}
  .a-form fieldset{border:1px solid var(--line);border-radius:var(--a-r)}
  .a-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .a-toolbar input[type=search]{flex:1;min-width:180px}

  /* 按鈕：覆寫官網 .btn 的浮起動效，後台用平實樣式 */
  .btn{font-size:13px;padding:7px 12px;border-radius:6px;font-weight:500;line-height:1.3;letter-spacing:0;border-width:1px;transition:background .15s,color .15s,border-color .15s}
  .btn:hover,.btn--solid:hover,.btn--ghost:hover{transform:none;box-shadow:none}
  .btn--ghost{border-color:var(--line);background:var(--card);color:var(--ink)}
  .btn--ghost:hover{background:var(--paper-alt);color:var(--ink)}
  .btn--solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn--solid:hover{background:#000;border-color:#000}
  .btn-sm{padding:5px 10px;font-size:12.5px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* 狀態膠囊：色點＋文字 */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--ink-soft);background:var(--card);font-weight:500;vertical-align:middle}
  .pill::before{content:"";width:6px;height:6px;border-radius:999px;background:currentColor;opacity:.5;flex:none}
  .pill-ok,.pill-live{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
  .pill-ok::before,.pill-live::before{background:var(--accent-strong);opacity:1}
  .pill-wait,.pill-draft{color:var(--muted)}
  .pill-done{color:var(--muted);text-decoration:line-through}

  /* 登入 */
  .a-login{min-height:100vh;display:grid;place-items:center;padding:calc(var(--a-top) + 24px) 16px 40px}
  .a-login-card{width:min(100%,400px);background:var(--card);border:1px solid var(--line);border-radius:var(--a-r);padding:28px}
  .a-login-card .a-brand{width:auto;margin-bottom:20px}

  /* 場地申請卡 */
  .application-card{border-top:1px solid var(--line);padding:16px 0;overflow-wrap:anywhere}
  .application-card h3{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .application-details{display:grid;grid-template-columns:7em minmax(0,1fr);gap:6px 12px;font-size:13px;margin:0 0 14px}
  .application-details dt{color:var(--muted)}
  .application-details dd{margin:0;white-space:pre-wrap}
  .application-review label{width:100%;min-width:0}
  .application-review textarea{width:100%;min-height:88px}
  .application-message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin-bottom:12px}
  @media(max-width:480px){.application-details{grid-template-columns:1fr;gap:3px}.application-details dd{margin-bottom:9px}}

  .a-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--ink);color:var(--paper);padding:.7em 1.2em;border-radius:8px;font-size:13px;
    transition:.2s;pointer-events:none;z-index:50;box-shadow:0 8px 24px -8px rgba(27,26,23,.4)}
  .a-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 社群經營 */
  .sp-h3{font-size:14px;font-weight:600;margin:20px 0 10px;display:flex;align-items:center}
  .sp-cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .sp-cal-h b{font-weight:600;font-size:14px;min-width:6.5em;text-align:center;font-variant-numeric:tabular-nums}
  .sp-cal-wrap{overflow-x:auto}
  .sp-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:660px}
  .sp-cal-wd{background:var(--paper-alt);padding:7px 8px;text-align:center;font-size:11px;color:var(--muted);letter-spacing:.06em}
  .sp-cal-d{background:var(--card);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .sp-cal-d.out{background:var(--paper)}
  .sp-cal-d.out .sp-cal-n{opacity:.45}
  .sp-cal-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.7;padding:0 .2em}
  .sp-cal-d.today .sp-cal-n{background:var(--ink);color:var(--paper);border-radius:999px;min-width:1.7em;height:1.7em;
    display:inline-grid;place-items:center;font-weight:600;padding:0}
  .sp-cal--week .sp-cal-d{min-height:300px}
  .sp-ev-head{display:flex;gap:5px;align-items:center;min-width:0}
  .sp-ev-thumb{display:block;width:100%;aspect-ratio:4/5;background:var(--line);overflow:hidden;position:relative;border-radius:3px}
  .sp-ev-thumb>.igp{position:absolute;top:0;left:0;transform-origin:top left}
  .sp-ev-sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;
    font-size:10.5px;color:var(--muted);line-height:1.35}
  .sp-ev{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;flex-direction:column;gap:4px;
    border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:5px;background:var(--paper);
    padding:3px 5px;font-size:11.5px;line-height:1.35;transition:border-color .15s}
  .sp-ev:hover{border-color:var(--ink);border-left-color:var(--ink)}
  .sp-ev:focus-visible{outline-offset:0}
  .sp-ev-p{font-weight:700;font-size:10px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
  .sp-ev-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sp-ev--scheduled{border-left-color:var(--accent-strong)}
  .sp-ev--published{border-left-color:var(--ink)}
  .sp-ev--draft{border-left-color:var(--line)}
  .sp-edit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  .sp-side{border:1px solid var(--line);border-radius:var(--a-r);padding:14px 16px;background:var(--paper);position:sticky;top:calc(var(--a-top) + 12px);font-size:13px}
  .sp-ul{margin:.4em 0 .8em;padding-left:1.2em;font-size:12.5px}
  .sp-ul li{margin:.2em 0}
  .sp-page{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;border:1px solid var(--line);
    border-radius:var(--a-r);padding:12px;margin-bottom:10px;background:var(--paper)}
  .sp-page-prev{overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--card)}
  .sp-page-ops{display:flex;gap:4px;align-items:center;margin-top:6px}
  .sp-page-form label{margin-bottom:8px}
  .sp-imgs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .sp-img{position:relative;display:inline-block}
  .sp-img img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .sp-img button{position:absolute;top:-6px;right:-6px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);cursor:pointer;font-size:11px;line-height:1.4;width:20px;height:20px;padding:0}
  /* X 貼文產生器 */
  .xs-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px;align-items:start}
  .xs-form label{margin-bottom:10px}
  .xp-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card);margin-bottom:12px}
  .xp-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .xp-avatar{width:40px;height:40px;border-radius:999px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:700;flex:none}
  .xp-name{font-weight:700;font-size:13.5px;line-height:1.2}
  .xp-handle{color:var(--muted);font-size:12px}
  .xp-text{white-space:pre-wrap;font-size:14px;line-height:1.5;word-break:break-word}
  .xs-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .xs-count.over{color:#B3261E;font-weight:700}
  /* 廣告總覽：預算進度條 */
  .ads-bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;position:relative;margin:8px 0 4px}
  .ads-bar>i{position:absolute;top:0;left:0;height:100%}

  @media(max-width:1020px){.xs-grid,.sp-edit{grid-template-columns:1fr}.sp-side{position:static}}
  @media(max-width:860px){
    .a-brand{width:auto}
    .a-brand span,.a-crumb{display:none}
    .a-shell{padding-top:var(--a-top)}
    .a-nav{position:sticky;top:var(--a-top);bottom:auto;width:auto;flex-direction:row;gap:4px;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
    .a-nav-g{flex-direction:row;gap:4px}
    .a-nav-gl,.a-nav-foot{display:none}
    .a-nav button{width:auto;height:32px;white-space:nowrap;border:1px solid var(--line);padding:0 10px}
    .a-nav button.on{border-color:var(--ink)}
    .a-main{margin-left:0;padding:12px 16px 40px}
    /* 窄螢幕：表格改為水平捲動，不再壓縮欄寬把中文擠成直排 */
    .a-wrap2{max-height:none}
    .a-wrap2 table.a-tbl{min-width:640px}
    .a-wrap2 table.a-tbl td{white-space:nowrap}
  }
</style>
</head>
<body>
<header class="a-top">
  <a class="a-brand" href="/admin" aria-label="後台首頁"><i>言</i><b>言文字</b><span>後台管理</span></a>
  <div class="a-crumb" id="a-crumb" hidden>後台 <span aria-hidden="true">/</span> <b id="a-crumb-cur">總覽</b> <span class="a-role" id="a-role"></span></div>
  <div class="a-top-act">
    <a class="btn btn--ghost btn-sm" href="/" target="_blank" rel="noopener">回前台</a>
    <button class="btn btn--ghost btn-sm" id="logout" style="display:none">登出</button>
  </div>
</header>

<main>
  <div id="app"><p class="a-center">載入中…</p></div>
</main>
<div class="a-toast" id="toast"></div>

<script src="/menu-lib.js"></script>
<script>
'use strict';
const KEY = 'tth_token';
const app = document.getElementById('app');
const logoutBtn = document.getElementById('logout');
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NT = n => 'NT$' + Number(n || 0).toLocaleString('en-US');
const num = n => Number(n || 0).toLocaleString('en-US');
let toastT, DATA = null, TAB = 'overview';
let MENU_DOC = null;
let MENU_DIRTY = false;
let MENU_DIRTY_TOASTED = false;
let MENU_SEEDED = false;
/* 場地申請按需載入；審核草稿跨分頁、refresh 保留。 */
let APPLICATIONS = null, APPLICATION_FILTER = 'pending', APPLICATION_LOADING = false;
let APPLICATION_REVIEWING = '', APPLICATION_MESSAGE = '';
const APPLICATION_DRAFTS = new Map();

/* 社群經營分頁狀態（資料按需載入；編輯狀態存全域，refresh 重繪不遺失） */
let SOCIAL_POSTS = null;          // null=未載入
let SOCIAL_VIEW = 'calendar';     // list | calendar | edit | igstudio | xstudio（預設月曆）
let SOCIAL_POSTS_VIEW = 'calendar'; // 貼文總覽內最後停留檢視（list|calendar），從產生器切回時恢復
let SOCIAL_CAL_MODE = 'week';     // week | month（預設週檢視）
let SOCIAL_CAL_WEEK = null;       // 週檢視起始日（週一）；null=本週
let SOCIAL_EDIT = null;           // 編輯中的貼文（複本）
let SOCIAL_DIRTY = false;
let SOCIAL_FILTER = { platform:'', status:'', q:'' };
let SOCIAL_CAL_MONTH = null;      // 日曆顯示月份 'YYYY-MM'；null=自動
/* 廣告總覽分頁狀態 */
let ADS_CAMPS = null;             // 投放紀錄；null=未載入
let ADS_EDIT = null;              // 編輯中的投放紀錄（複本；id='' 為新增）
let ADS_LOADING = false;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

// datetime-local 值 ↔ ISO
function toLocalInput(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }

// Google 導回時 token 夾在 fragment
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('token')) { localStorage.setItem(KEY, hash.get('token')); history.replaceState(null,'',location.pathname); }
let token = localStorage.getItem(KEY);

/* 路由：一般路徑（/admin、/admin/members、/admin/social/edit/:id…），伺服器對 /admin/* 皆回本頁。
   舊 #hash 網址（/admin#members）進站時轉成路徑，書籤不失效。 */
const BASE = '/admin';
if (location.hash.length > 1 && !hash.get('token')) history.replaceState(null, '', BASE + '/' + location.hash.slice(1).replace(/^\/+/, ''));
function routePath(){
  let p = location.pathname;
  if (p.startsWith(BASE)) p = p.slice(BASE.length);
  if (p === '.html') p = '';
  return p.replace(/^\/+|\/+$/g, '').split('/').map(s => { try { return decodeURIComponent(s); } catch (_) { return s; } }).join('/');
}
function go(route, replace){
  const url = BASE + (route ? '/' + route.split('/').map(encodeURIComponent).join('/') : '');
  if (location.pathname !== url) history[replace ? 'replaceState' : 'pushState'](null, '', url);
  applyRoute();
}
// 站內 /admin/* 連結一律走前端路由，不整頁重載
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="/admin"]');
  if (!a || a.target || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
  e.preventDefault();
  go(new URL(a.href).pathname.slice(BASE.length).replace(/^\/+/, ''));
});

async function api(path, { method='GET', body } = {}) {
  const res = await fetch('/api'+path, {
    method, headers:{ 'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let d={}; try{ d=await res.json(); }catch(e){}
  if (!res.ok) throw Object.assign(new Error(d.error || ('伺服器錯誤（'+res.status+'）')), {status:res.status});
  return d;
}

/* ---------- CSV 匯出（純前端） ---------- */
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    let s = c == null ? '' : String(c);
    // 防公式注入：以 = + - @ 或 tab/CR 開頭的儲存格前綴單引號，避免試算表當公式執行
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});   // BOM 讓 Excel 正確辨識 UTF-8
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 衍生資料 ---------- */
function derived(d){
  const paid = d.commitments.filter(c=>c.payment_status==='已付款');
  const joined = new Set(paid.map(c=>c.user_id)).size;
  const pending = d.commitments.filter(c=>c.payment_status!=='已付款').reduce((s,c)=>s+Number(c.amount),0);
  const people = new Set(d.commitments.map(c=>c.user_id)).size;
  const cByUser = {}; d.commitments.forEach(c=>{ if(!cByUser[c.user_id]) cByUser[c.user_id]=c; });
  return { joined, pending, people, cByUser };
}

/* ---------- 菜單（site_content.menu） ---------- */
function ensureMenuDoc(d) {
  const raw = d.content && d.content.menu;
  if (typeof raw === 'string' && raw.trim()) {
    MENU_SEEDED = false;
    return MenuLib.parseMenuDoc(raw);
  }
  const seed = window.__MENU_SEED || window.MENU_DATA;
  if (seed) {
    MENU_SEEDED = true;
    return MenuLib.fromSeedRows(seed);
  }
  MENU_SEEDED = false;
  return MenuLib.parseMenuDoc('');
}

// IG 產生器讀 window.MENU_DATA；每次 MENU_DOC 有更新都要同步，確保帶入的是目前顯示中的清單（含未存檔編輯）。
function syncWindowMenuData() {
  const items = MENU_DOC && Array.isArray(MENU_DOC.items)
    ? MENU_DOC.items
    : MenuLib.fromSeedRows(window.__MENU_SEED || window.MENU_DATA || []).items;

}

    </dl>

      <label>審核回覆（必填，申請者會看到）
        <textarea name="review_note" required maxlength="2000" ${APPLICATION_REVIEWING===a.id?'readonly':''} placeholder="請填寫給申請社群的審核理由與後續聯絡事項">${esc(APPLICATION_DRAFTS.get(a.id) || '')}</textarea>
      </label>
      <button class="btn btn--solid btn-sm" type="submit" data-status="approved" ${busy?'disabled':''}>${APPLICATION_REVIEWING===a.id?'送出中…':'通過申請'}</button>

    </form>`:APPLICATION_DRAFTS.has(a.id)?`<details><summary>未送出的審核草稿</summary><p style="white-space:pre-wrap">${esc(APPLICATION_DRAFTS.get(a.id))}</p></details>`:''}
  </article>`).join('');
  host.setAttribute('aria-busy', String(busy));
  host.innerHTML = `<h2>場地申請 <span class="pill pill-wait">${APPLICATIONS===null?'待審數尚未載入':`待審 ${pending} 件`}</span></h2>

async function loadApplications(message=''){
  if (APPLICATION_LOADING) return;
  APPLICATION_LOADING = true;
  APPLICATION_MESSAGE = message;
  paintApplications();
  try {
    const data = await api('/admin/event-applications');
    if (!Array.isArray(data.applications)) throw new Error('申請資料格式不正確，請重新載入。');
    APPLICATIONS = data.applications;
  } catch(e) {
    APPLICATION_MESSAGE = (message ? message+' ' : '')+'載入失敗：'+e.message;
  } finally {
    APPLICATION_LOADING = false;
    paintApplications();
  }
}

async function reviewApplication(form, status){
  if (APPLICATION_REVIEWING || APPLICATION_LOADING || !['approved','rejected'].includes(status)) return;
  const id = form.dataset.applicationReview;
  const note = form.elements.review_note;
  APPLICATION_DRAFTS.set(id, note.value);
  if (!note.value.trim() || note.value.trim().length>2000) {
    note.setCustomValidity('請填寫 1 至 2000 字的審核回覆。');
    note.reportValidity();
    note.oninput = e=>{ note.setCustomValidity(''); APPLICATION_DRAFTS.set(id,e.target.value); };
    return;
  }
  APPLICATION_REVIEWING = id;
  APPLICATION_MESSAGE = '';
  paintApplications();
  try {
    const data = await api('/admin/event-applications/'+encodeURIComponent(id)+'/review', {
      method:'POST', body:{status, review_note:note.value.trim(), expected_status:'pending'},
    });
    if (data.ok!==true || data.application?.id!==id || data.application.status!==status) throw new Error('無法確認審核結果，請重新載入確認；草稿已保留。');
    APPLICATIONS = APPLICATIONS.map(a=>a.id===id?data.application:a);
    APPLICATION_DRAFTS.delete(id);
    APPLICATION_MESSAGE = status==='approved'?'已通過申請；請另行聯絡社群，書面確認檔期與費用。':'已將申請標記為未通過；請另行聯絡申請社群。';
  } catch(e) {
    APPLICATION_MESSAGE = '審核未完成：'+e.message+' 審核草稿已保留。';
    if (e.status===409) await loadApplications('此申請狀態已變更；未送出的審核草稿仍保留，可切換篩選查看。');
  } finally {
    APPLICATION_REVIEWING = '';
    paintApplications();
  }
}

function render(d){
  DATA = d;
  // 社群編輯器若在畫面上，先把 DOM 現值收回 SOCIAL_EDIT，整頁重繪才不會洗掉輸入
  if (SOCIAL_VIEW==='edit' && SOCIAL_EDIT && document.getElementById('sp-e-title')) socialCollectEdit();
  if (!MENU_DIRTY || MENU_DOC === null) {
    MENU_DOC = ensureMenuDoc(d);
  } else {
    const raw = d.content && d.content.menu;
    MENU_SEEDED = !(typeof raw === 'string' && raw.trim()) && !!(window.__MENU_SEED || window.MENU_DATA);
    if (!MENU_DIRTY_TOASTED) {
      toast('菜單有未儲存變更，已保留本機編輯');
      MENU_DIRTY_TOASTED = true;
    }
  }
  syncWindowMenuData();
  if (d.me && d.me.name) try { localStorage.setItem('tth_name', d.me.name); } catch (e) {}
  logoutBtn.style.display='';
  const x = derived(d);
  const tabs = TABS.filter(t => !t.super || d.super);
  if (!tabs.find(t=>t.id===TAB)) TAB='overview';
  const navBtn = t => {
    const badge = t.id==='applications' ? '<span class="badge" data-application-count hidden></span>' : t.id==='events' && (d.events||[]).length ? `<span class="badge">${d.events.length}</span>` : '';
    return `<button data-tab="${t.id}" class="${t.id===TAB?'on':''}" aria-current="${t.id===TAB?'page':'false'}">${ico(t.id)}<span class="l">${t.label}</span>${badge}</button>`;
  };
  const nav = NAV_GROUPS.map(([g, ids]) => {
    const btns = ids.map(id => tabs.find(t=>t.id===id)).filter(Boolean).map(navBtn).join('');
    return btns ? `<div class="a-nav-g"><div class="a-nav-gl">${g}</div>${btns}</div>` : '';
  }).join('');
  const panels = tabs.map(t=>`<div class="a-tab ${t.id===TAB?'on':''}" data-panel="${t.id}">${t.render(d,x)}</div>`).join('');
  const me = d.me || {};
  app.innerHTML = `<div class="a-shell">
    <nav class="a-nav" aria-label="後台分頁">${nav}
      <div class="a-nav-foot"><b>${esc(me.name||'')}</b>${esc(me.email||'')}</div>
    </nav>
    <div class="a-main">${panels}</div>
  </div>`;
  const crumb = document.getElementById('a-crumb');
  if (crumb) { crumb.hidden = false; document.getElementById('a-role').textContent = d.super ? '超級管理員' : '管理員'; }
  bindNav(); bind(d, x);
}

function bindNav(){
  // 每個分頁有獨立網址（/admin/<tab>），瀏覽器上一頁可回前一個分頁／檢視
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const t = b.dataset.tab;
    go(t === 'social' ? 'social/' + (SOCIAL_VIEW==='edit'?SOCIAL_POSTS_VIEW:SOCIAL_VIEW) : t);
  });
}

function activateTab(t){
  TAB = t;
  document.querySelectorAll('[data-tab]').forEach(n=>{ const on = n.dataset.tab===TAB; n.classList.toggle('on',on); n.setAttribute('aria-current', on?'page':'false'); });
  document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('on',p.dataset.panel===TAB));
  const label = (TABS.find(x=>x.id===TAB)||{}).label || '';
  const cur = document.getElementById('a-crumb-cur'); if (cur) cur.textContent = label;
  document.title = `${label} · 後台管理 · 言文字`;
}

function applyRoute(){
  let h = routePath();
  if (h === 'ig') h = 'social/igstudio';   // 舊網址相容：IG 產生器已併入社群經營
  if (h === 'social/ads') h = 'ads';       // 廣告總覽已獨立成分頁
  if (!document.querySelector('[data-panel]')) return;
  const parts = (h || 'overview').split('/');
  const tab = parts[0];
  if (!document.querySelector(`[data-panel="${CSS.escape(tab)}"]`)) { go('', true); return; }
  activateTab(tab);
  if (tab === 'applications') { if (APPLICATIONS===null) loadApplications(); else paintApplications(); return; }
  if (tab === 'ads') { paintAds(); return; }
  if (tab !== 'social') return;
  const v = parts[1] || SOCIAL_VIEW;
  if (['igstudio','xstudio'].includes(v)) {
    SOCIAL_VIEW = v; SOCIAL_EDIT = null; SOCIAL_DIRTY = false;
    paintSocial(); return;
  }
  if (SOCIAL_POSTS === null) {
    // 首次載入時 paintSocial 會把網址同步成預設檢視；載完後把深連結（如 social/edit/:id）寫回再套用
    const want = h;
    loadSocialPosts().then(()=>{ if (routePath() !== want) history.replaceState(null, '', BASE + '/' + want); applyRoute(); });
    return;
  }
  if (v === 'edit' && parts[2]) {
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===parts[2]);
    if (p) {
      SOCIAL_EDIT = JSON.parse(JSON.stringify(p));
      SOCIAL_EDIT.metrics = SOCIAL_EDIT.metrics||{}; SOCIAL_EDIT.pages = SOCIAL_EDIT.pages||[]; SOCIAL_EDIT.images = SOCIAL_EDIT.images||[];
      SOCIAL_DIRTY = false; SOCIAL_VIEW = 'edit';
    }
  } else if (['list','calendar'].includes(v)) {
    SOCIAL_VIEW = v; SOCIAL_EDIT = null; SOCIAL_DIRTY = false;
  }
  paintSocial();
}
window.addEventListener('popstate', applyRoute);

function bind(d, x){
  const on = (sel,ev,fn)=>{ const el=document.getElementById(sel); if(el) el.addEventListener(ev,fn); };
  const doThen = async (fn,msg)=>{ try{ await fn(); toast(msg); await refresh(); }catch(e){ toast(e.message); } };

  // 會員：搜尋 + CSV
  on('m-search','input',e=>{ const qv=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#m-body tr').forEach(tr=>{ const qq=(tr.dataset.q||'').toLowerCase();
      tr.style.display = !qv || qq.includes(qv) ? '' : 'none'; }); });
  on('m-csv','click',()=>{ const rows=[['姓名','Email','電話','Active','點數','權益摘要','創始狀態','會員編號','加入日']];
    (d.users||[]).forEach(u=>{ const c=x.cByUser[u.id];
      rows.push([u.name||'', u.email||'', u.phone||'', u.access_active?'Active':'', u.points_balance!=null?String(u.points_balance):'', u.access_summary||'—', c?(c.membership_status||''):'尚未加入', c?c.cert_no:'', u.created_at||'']); });
    downloadCSV('會員名單.csv', rows); });
  on('pg-go','click',()=>{
    const user_id=((document.getElementById('pg-uid')||{}).value||'').trim();
    const amount=Number((document.getElementById('pg-amt')||{}).value);
    const note=((document.getElementById('pg-note')||{}).value||'').trim();
    const expRaw=((document.getElementById('pg-exp')||{}).value||'').trim();
    if(!user_id||!Number.isInteger(amount)||amount<1){ toast('請填 user id 與正整數點數'); return; }
    if(!note){ toast('備註必填'); return; }
    const body={ user_id, amount, note };
    if(expRaw) body.expires_at=new Date(expRaw).toISOString();
    doThen(()=>api('/admin/points/grants',{method:'POST',body}),'已發放點數');
  });

  // 參與紀錄：確認入帳
  document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>doThen(()=>api('/admin/commitments/'+b.dataset.confirm+'/confirm',{method:'POST'}),'已確認入帳'));

  // 活動：建立／更新、名單、付款與簽到
  on('ev-save','click',()=>{ const title=document.getElementById('ev-title').value.trim(); if(!title){toast('請輸入活動名稱');return;}
    const editing = !!document.getElementById('ev-id').value;
    doThen(()=>api('/admin/events',{method:'POST',body:{
      id: document.getElementById('ev-id').value || undefined,
      title,
      slug: document.getElementById('ev-slug').value.trim() || undefined,
      starts_at: document.getElementById('ev-when').value || undefined,
      ends_at: document.getElementById('ev-end').value || undefined,
      location: document.getElementById('ev-loc').value.trim(),
      capacity: Number(document.getElementById('ev-cap').value)||0,
      price_twd: Number(document.getElementById('ev-price').value)||0,
      visibility: document.getElementById('ev-visibility').value,
      status: document.getElementById('ev-status').value,
      description: document.getElementById('ev-desc').value.trim(),
    }}), editing?'已更新活動':'已建立活動'); });
  on('ev-reset','click',()=>resetEventForm());
  document.querySelectorAll('[data-ev-edit]').forEach(b=>b.onclick=()=>{
    const e=(d.events||[]).find(x=>x.id===b.dataset.evEdit); if(!e) return;
    document.getElementById('ev-id').value=e.id;
    document.getElementById('ev-title').value=e.title||'';
    document.getElementById('ev-slug').value=e.slug||'';
    document.getElementById('ev-when').value=toLocalInput(e.starts_at_iso);
    document.getElementById('ev-end').value=toLocalInput(e.ends_at_iso);
    document.getElementById('ev-loc').value=e.location||'';
    document.getElementById('ev-cap').value=e.capacity||0;
    document.getElementById('ev-price').value=e.price_twd||0;
    document.getElementById('ev-visibility').value=e.visibility||'public';
    document.getElementById('ev-status').value=e.status||'報名中';
    document.getElementById('ev-desc').value=e.description||'';
    document.getElementById('ev-save').textContent='更新活動';
    document.getElementById('ev-reset').style.display='';
    window.scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelectorAll('[data-ev-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('確定刪除此活動？已有報名紀錄的活動不能刪除。')) return;
    doThen(()=>api('/admin/events/'+b.dataset.evDel,{method:'DELETE'}),'已刪除活動'); });
  document.querySelectorAll('[data-ev-regs]').forEach(b=>b.onclick=()=>showRegs(b.dataset.evRegs, d));

  // 最新消息
  on('u-add','click',()=>{ const title=document.getElementById('u-title').value.trim(); if(!title){toast('請輸入標題');return;}
    doThen(()=>api('/admin/updates',{method:'POST',body:{title,type:document.getElementById('u-type').value,content:document.getElementById('u-content').value.trim(),date:document.getElementById('u-date').value||undefined}}),'已發布'); });
  document.querySelectorAll('[data-upd-del]').forEach(b=>b.onclick=()=>doThen(()=>api('/admin/updates/'+b.dataset.updDel,{method:'DELETE'}),'已刪除'));

  // 網站內容
  on('ct-save','click',()=>doThen(()=>{
    const val = id => (document.getElementById(id)?.value || '').trim();
    const put = (key, value) => api('/admin/content',{method:'POST',body:{key,value}});
    const jobs = [
      put('home_notice', val('ct-notice')),
      put('space_hero_image', val('ct-space-hero-image')),
    ];
    [1,2,3,4].forEach(n => {
      const zh = val(`ct-space-${n}f-zh`);
      jobs.push(put(`space_${n}f_zh`, zh));
      jobs.push(put(`space_${n}f_en`, val(`ct-space-${n}f-en`)));
      jobs.push(put(`space_${n}f_ja`, val(`ct-space-${n}f-ja`)));
      jobs.push(put(`space_${n}f_image`, val(`ct-space-${n}f-image`)));
      if (n <= 3) jobs.push(put(`space_${n}f`, zh)); // 舊版相容
    });
    return Promise.all(jobs);
  },'已儲存'));

  // 網站內容：換圖上傳（multipart，不能走共用的 api()）
  document.querySelectorAll('[data-space-upload]').forEach(input => input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const targetEl = document.getElementById(input.dataset.target);
    const previewEl = document.getElementById(input.dataset.preview);
    try {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch(input.dataset.uploadUrl || '/api/admin/upload/space', {
        method: 'POST',
        headers: token ? { Authorization: 'Bearer ' + token } : {},
        body: fd,
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || ('上傳失敗（' + r.status + '）'));
      if (targetEl) targetEl.value = data.url;
      if (previewEl) { previewEl.src = data.url; previewEl.style.display = ''; }
      toast(input.dataset.uploadUrl ? '已上傳圖片，記得按「新增／更新項目」再「儲存至伺服器」' : '已上傳圖片，記得按「儲存所有網站內容」');
    } catch (e) {
      toast(e.message);
    } finally {
      input.value = '';
    }
  });

  // 管理員
  document.querySelectorAll('[data-admin]').forEach(b=>b.onclick=()=>doThen(()=>api('/admin/users/'+b.dataset.admin+'/admin',{method:'POST',body:{admin:b.dataset.on==='1'}}),'已更新管理權限'));

  // 菜單
  bindMenu();

  // 社群經營：refresh 後由目前狀態重繪（編輯中內容存於 SOCIAL_EDIT，不遺失；IG/X 產生器由 paintSocial 掛載）
  if (SOCIAL_POSTS !== null || TAB === 'social') {
    if (SOCIAL_POSTS === null) loadSocialPosts();
    else paintSocial();
  }
  // 廣告總覽：refresh 後重繪（資料未載入時由 paintAds 觸發載入）
  if (ADS_CAMPS !== null || TAB === 'ads') paintAds();
  paintApplications();
}

/* ---------- 菜單：局部重繪 + 綁定（不觸發整頁 refresh，避免遺失未存檔編輯） ---------- */
function applyMenuSearch(qv){
  const q = (qv ?? document.getElementById('mi-search')?.value ?? '').trim().toLowerCase();
  document.querySelectorAll('#mi-body tr').forEach(tr=>{
    const qq = (tr.dataset.q || '').toLowerCase();
    tr.style.display = !q || qq.includes(q) ? '' : 'none';
  });
}

function paintMenu(){
  const panel = document.querySelector('[data-panel="menu"]');
  if (!panel) return;
  const savedSearch = document.getElementById('mi-search')?.value || '';
  syncWindowMenuData();
  panel.innerHTML = tabMenu(DATA);
  bindMenu();
  const searchEl = document.getElementById('mi-search');
  if (searchEl) {
    searchEl.value = savedSearch;
    applyMenuSearch(savedSearch);
  }
}

function resetMenuForm(){
  document.getElementById('mi-id').value = '';
  document.getElementById('mi-venue').value = 'CAFE';
  document.getElementById('mi-cat').value = 'FOOD';
  ['mi-zh','mi-en','mi-note','mi-image'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  const pv=document.getElementById('prev-mi-image'); if(pv){ pv.src=''; pv.style.display='none'; }
  document.getElementById('mi-price').value = 0;
  document.getElementById('mi-emo').value = 0;
  document.getElementById('mi-sort').value = 0;
  document.getElementById('mi-alcohol').checked = false;
  document.getElementById('mi-published').checked = false;
  document.getElementById('mi-save').textContent = '新增項目';
  document.getElementById('mi-reset').style.display = 'none';
}

function bindMenu(){
  if (!document.getElementById('mi-body')) return; // 菜單分頁尚未掛載於 DOM
  const on = (sel,ev,fn)=>{ const el=document.getElementById(sel); if(el) el.addEventListener(ev,fn); };

  on('mi-search','input',e=> applyMenuSearch(e.target.value));

  on('mi-save','click',()=>{
    const zh = document.getElementById('mi-zh').value.trim();
    if (!zh){ toast('請輸入品名（中）'); return; }
    const editing = !!document.getElementById('mi-id').value;
    MENU_DOC = MenuLib.upsertItem(MENU_DOC, {
      id: document.getElementById('mi-id').value || undefined,
      venue: document.getElementById('mi-venue').value,
      cat: document.getElementById('mi-cat').value,
      zh, en: document.getElementById('mi-en').value.trim(),
      price: Number(document.getElementById('mi-price').value) || 0,
      emo: Number(document.getElementById('mi-emo').value) || 0,
      note: document.getElementById('mi-note').value.trim(),
      image: document.getElementById('mi-image').value.trim(),
      alcohol: document.getElementById('mi-alcohol').checked,
      published: document.getElementById('mi-published').checked,
      sort: Number(document.getElementById('mi-sort').value) || 0,
    });
    MENU_DIRTY = true;
    toast(editing ? '已更新（尚未存檔）' : '已新增（尚未存檔）');
    paintMenu();
  });
  on('mi-reset','click',()=>resetMenuForm());

  document.querySelectorAll('[data-mi-edit]').forEach(b=>b.onclick=()=>{
    const it = MENU_DOC.items.find(x=>x.id===b.dataset.miEdit); if(!it) return;
    document.getElementById('mi-id').value = it.id;
    document.getElementById('mi-venue').value = it.venue || 'CAFE';
    document.getElementById('mi-cat').value = it.cat;
    document.getElementById('mi-zh').value = it.zh;
    document.getElementById('mi-en').value = it.en;
    document.getElementById('mi-price').value = it.price;
    document.getElementById('mi-emo').value = it.emo;
    document.getElementById('mi-sort').value = it.sort;
    document.getElementById('mi-note').value = it.note;
    document.getElementById('mi-image').value = it.image || '';
    { const pv=document.getElementById('prev-mi-image'); pv.src = it.image || ''; pv.style.display = it.image ? '' : 'none'; }
    document.getElementById('mi-alcohol').checked = !!it.alcohol;
    document.getElementById('mi-published').checked = !!it.published;
    document.getElementById('mi-save').textContent = '更新項目';
    document.getElementById('mi-reset').style.display = '';
    document.getElementById('mi-zh').scrollIntoView({behavior:'smooth',block:'center'});
  });
  document.querySelectorAll('[data-mi-del]').forEach(b=>b.onclick=()=>{
    if (!confirm('確定刪除此菜單項目？')) return;
    MENU_DOC = MenuLib.removeItem(MENU_DOC, b.dataset.miDel);
    MENU_DIRTY = true;
    toast('已刪除（尚未存檔）');
    paintMenu();
  });

  on('menu-load-seed','click',()=>{
    const seed = window.__MENU_SEED || [];
    if (!seed.length){ toast('找不到預設菜單資料'); return; }
    if (!confirm(`以預設菜單（${seed.length} 項，全部已發布）取代目前清單？需再按「儲存至伺服器」才會生效。`)) return;
    const doc = MenuLib.fromSeedRows(seed);
    doc.items = doc.items.map(it => ({ ...it, published: true }));
    MENU_DOC = doc;
    MENU_DIRTY = true;
    toast('已載入預設菜單（尚未存檔）');
    paintMenu();
  });

  on('menu-save-server','click',()=>{
    const v = MenuLib.validateDoc(MENU_DOC);
    if (!v.ok){ toast(v.error); return; }
    (async () => {
      try {
        await api('/admin/content', { method:'POST', body:{ key:'menu', value: MenuLib.stringifyDoc(MENU_DOC) } });
        MENU_DIRTY = false;
        MENU_DIRTY_TOASTED = false;
        toast('菜單已儲存至伺服器');
        await refresh();
      } catch(e){ toast(e.message); }
    })();
  });
}

let EVENT_SCANNER_STREAM = null;
let EVENT_SCANNER_FRAME = 0;
function stopEventScanner(){
  cancelAnimationFrame(EVENT_SCANNER_FRAME);
  EVENT_SCANNER_FRAME = 0;
  if(EVENT_SCANNER_STREAM) EVENT_SCANNER_STREAM.getTracks().forEach(t=>t.stop());
  EVENT_SCANNER_STREAM = null;
}

async function showRegs(eventId, d){
  stopEventScanner();
  const host = document.getElementById('ev-regs');
  const ev = (d.events||[]).find(e=>e.id===eventId) || {};
  host.style.display=''; host.innerHTML='<p class="a-sub">載入報名名單…</p>';
  try{
    const { regs } = await api('/admin/events/'+eventId+'/regs');
    const body = regs.map(r=>`<tr><td>${esc(r.name||'—')}<br><span class="a-mono" style="color:var(--muted)">${esc(r.email||'')}</span></td>
      <td>${esc(r.status)}</td><td class="num">${r.amount_due>0?NT(r.amount_paid)+'／'+NT(r.amount_due):'免費'}</td>
      <td>${esc(r.checked_in_at||'尚未')}</td><td>${esc(r.note||'')}</td><td class="num">${esc(r.created_at)}</td>
      <td style="white-space:nowrap">${r.status==='registered'?(r.checked_in_at
        ?`<button class="btn btn--ghost btn-sm" data-uncheckin="${r.id}">取消簽到</button>`
        :`<button class="btn btn--solid btn-sm" data-checkin="${r.id}">簽到</button>`):''}
        ${r.status==='registered'&&r.amount_paid>0?`<button class="btn btn--ghost btn-sm" data-refund="${r.id}" data-refund-amount="${r.amount_paid}">全額退款</button>`:''}</td></tr>`).join('')
      || '<tr><td colspan="7" class="a-empty">尚無報名</td></tr>';
    host.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">
        <b>「${esc(ev.title||'')}」名單（${regs.length}）</b>
        <span><button class="btn btn--ghost btn-sm" id="rg-csv">匯出 CSV</button>
        <button class="btn btn--ghost btn-sm" id="rg-close">關閉</button></span>
      </div>
      <div class="a-form" style="align-items:end">
        <label style="flex:1">QR 票券內容<input id="rg-token" autocomplete="off" placeholder="掃描槍輸入或貼上票券"></label>
        <button class="btn btn--solid btn-sm" id="rg-scan">驗票簽到</button>
        <button class="btn btn--ghost btn-sm" id="rg-camera">開啟相機掃描</button>
      </div>
      <video id="rg-video" playsinline muted style="display:none;width:min(100%,520px);border-radius:12px;margin:8px 0"></video>
      <div class="a-wrap2"><table class="a-tbl">
        <thead><tr><th>姓名／Email</th><th>票券狀態</th><th class="num">付款</th><th>簽到</th><th>備註</th><th class="num">報名時間</th><th>操作</th></tr></thead>
        <tbody>${body}</tbody></table></div>`;

    const checkIn = async body => {
      try{
        const out = await api('/admin/events/'+eventId+'/check-in',{method:'POST',body});
        toast(out.duplicate?'這張票已簽到':'已完成簽到：'+(out.guest?.name||''));
        await showRegs(eventId,d);
      }catch(e){ toast(e.message); }
    };
    document.getElementById('rg-close').onclick=()=>{ stopEventScanner(); host.style.display='none'; host.innerHTML=''; };
    document.getElementById('rg-csv').onclick=()=>{ const rows=[['姓名','Email','電話','票券狀態','應付','已付','簽到時間','備註','報名時間']];
      regs.forEach(r=>rows.push([r.name||'',r.email||'',r.phone||'',r.status||'',r.amount_due||0,r.amount_paid||0,r.checked_in_at||'',r.note||'',r.created_at||'']));
      downloadCSV('活動名單_'+(ev.title||'活動')+'.csv', rows); };
    document.getElementById('rg-scan').onclick=()=>{ const token=document.getElementById('rg-token').value.trim(); if(token) checkIn({token}); else toast('請先掃描或貼上票券'); };
    document.getElementById('rg-token').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); document.getElementById('rg-scan').click(); } };
    document.querySelectorAll('[data-checkin]').forEach(b=>b.onclick=()=>checkIn({registration_id:b.dataset.checkin}));
    document.querySelectorAll('[data-uncheckin]').forEach(b=>b.onclick=async()=>{
      try{ await api('/admin/events/'+eventId+'/check-in/'+b.dataset.uncheckin,{method:'DELETE'}); toast('已取消簽到'); await showRegs(eventId,d); }catch(e){ toast(e.message); }
    });
    document.querySelectorAll('[data-refund]').forEach(b=>b.onclick=async()=>{
      if(!confirm(`確定全額退款 ${NT(b.dataset.refundAmount)}？退款後票券立即失效。`)) return;
      try{ await api('/admin/events/'+eventId+'/regs/'+b.dataset.refund+'/refund',{method:'POST'}); toast('已完成全額退款'); await showRegs(eventId,d); }catch(e){ toast(e.message); }
    });
    document.getElementById('rg-camera').onclick=async()=>{
      if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia){ toast('此瀏覽器不支援相機掃碼，請改用掃描槍或貼上票券。'); return; }
      try{
        stopEventScanner();
        const video=document.getElementById('rg-video');
        EVENT_SCANNER_STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
        video.srcObject=EVENT_SCANNER_STREAM; video.style.display='block'; await video.play();
        const detector=new BarcodeDetector({formats:['qr_code']});
        const tick=async()=>{
          if(!EVENT_SCANNER_STREAM) return;
          const codes=await detector.detect(video).catch(()=>[]);
          if(codes[0]?.rawValue){ const token=codes[0].rawValue; stopEventScanner(); await checkIn({token}); return; }
          EVENT_SCANNER_FRAME=requestAnimationFrame(tick);
        };
        tick();
      }catch(e){ stopEventScanner(); toast('無法開啟相機：'+e.message); }
    };
    host.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){ host.innerHTML='<p class="a-sub">'+esc(e.message)+'</p>'; }
}

function loadSocialPosts(){
  if (SOCIAL_LOADP) return SOCIAL_LOADP;
  SOCIAL_LOADP = (async () => {

/* 日期工具：本地時區，避免 toISOString 位移一天 */
const spDate = s => { const d = new Date(String(s).replace(' ','T')); return isNaN(d) ? null : d; };
const spYM   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const spDay  = d => `${spYM(d)}-${String(d.getDate()).padStart(2,'0')}`;
const spShiftYM = (ym, n) => { const [Y,M] = ym.split('-').map(Number); return spYM(new Date(Y, M-1+n, 1)); };

// 目前顯示月份：未選則取最早一則排程貼文的月份，否則本月
function socialCalYM(){
  if (SOCIAL_CAL_MONTH) return SOCIAL_CAL_MONTH;
  const ds = (SOCIAL_POSTS||[]).map(p=>spDate(p.scheduled_at)).filter(Boolean).sort((a,b)=>a-b);
  return spYM(ds[0] || new Date());
}

function socialWeekHTML(){
  // 週檢視：週一為首，預設本週
  const base = SOCIAL_CAL_WEEK ? spDate(SOCIAL_CAL_WEEK) : new Date();
  const mon = new Date(base); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const days = Array.from({length:7}, (_,i)=>{ const d=new Date(mon); d.setDate(mon.getDate()+i); return d; });
  const byDay = new Map();
  for (const p of socialFiltered()){
    const d = spDate(p.scheduled_at); if (!d) continue;
    const k = spDay(d); if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push({ p, d });
  }
  const todayK = spDay(new Date());
  let weekCount = 0;
  const WD = ['一','二','三','四','五','六','日'];
  const head = days.map((d,i)=>`<div class="sp-cal-wd">${WD[i]} ${d.getMonth()+1}/${d.getDate()}</div>`).join('');
  const grid = days.map(d=>{
    const k = spDay(d);
    const items = (byDay.get(k)||[]).sort((a,b)=>a.d-b.d);
    weekCount += items.length;
    const evs = items.map(({p, d:dd})=>{
      const st = SOCIAL_STATUS_META[p.status] || SOCIAL_STATUS_META.draft;
      const hh = `${String(dd.getHours()).padStart(2,'0')}:${String(dd.getMinutes()).padStart(2,'0')}`;
      const t = p.title.replace(/^[WSX]?\d*\s*[｜|]?\s*/, '');
      const tip = hh + ' ' + p.title + '（' + st.label + '）' + (p.phase ? ' · ' + p.phase : '');
      const sum = String(p.caption||'').split('\n').find(l=>l.trim()) || '';
      const hasThumb = p.platform==='ig' && (p.pages||[]).length;
      return `<button class="sp-ev sp-ev--${esc(p.status)}" data-sp-edit="${esc(p.id)}" title="${esc(tip)}">
        <span class="sp-ev-head"><span class="sp-ev-p">${p.platform==='ig'?'IG':'X'} ${esc(hh)}</span>
          <span class="sp-ev-t">${esc(t)}</span></span>
        ${hasThumb?`<span class="sp-ev-thumb" data-cal-prev="${esc(p.id)}"></span>`:''}
        ${sum?`<span class="sp-ev-sum">${esc(sum.slice(0,42))}</span>`:''}</button>`;
    }).join('');
    return `<div class="sp-cal-d${k===todayK?' today':''}"><span class="sp-cal-n">${d.getDate()}</span>${evs}</div>`;
  }).join('');
  const sun = days[6];
  const label = `${mon.getFullYear()}/${mon.getMonth()+1}/${mon.getDate()} – ${sun.getMonth()+1}/${sun.getDate()}`;
  return `${socialToolbar()}
  <div class="sp-cal-h">
    <button class="btn btn--ghost btn-sm" id="sp-cal-prev" aria-label="上一週">‹</button>
    <b>${label}</b>
    <button class="btn btn--ghost btn-sm" id="sp-cal-next" aria-label="下一週">›</button>
    <button class="btn btn--ghost btn-sm" id="sp-cal-today">本週</button>
    <span style="flex:1"></span>
    <button class="btn btn-sm btn--solid" id="sp-cal-mode-week">週</button>
    <button class="btn btn-sm btn--ghost" id="sp-cal-mode-month">月</button>
    <span style="color:var(--muted);font-size:.8rem">本週 ${weekCount} 則</span>
  </div>
  <div class="sp-cal-wrap"><div class="sp-cal sp-cal--week">${head}${grid}</div></div>`;
}

function socialCalendarHTML(){
  if (SOCIAL_CAL_MODE === 'week') return socialWeekHTML();
  const ym = socialCalYM();
  const [Y, M] = ym.split('-').map(Number);
  const lead = (new Date(Y, M-1, 1).getDay() + 6) % 7;      // 週一為週首
  const start = new Date(Y, M-1, 1 - lead);
  const cells = Math.ceil((lead + new Date(Y, M, 0).getDate()) / 7) * 7;

  const byDay = new Map();
  for (const p of socialFiltered()){
    const d = spDate(p.scheduled_at);
    if (!d) continue;
    const k = spDay(d);
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push({ p, d });
  }
  const todayK = spDay(new Date());

  let grid = '';
  let monthCount = 0;
  for (let i = 0; i < cells; i++){
    const d = new Date(Y, M-1, 1 - lead + i);
    const k = spDay(d);
    const out = d.getMonth() !== M-1;
    const items = (byDay.get(k) || []).sort((a,b)=>a.d-b.d);
    if (!out) monthCount += items.length;
    const evs = items.map(({p, d:dd})=>{
      const st = SOCIAL_STATUS_META[p.status] || SOCIAL_STATUS_META.draft;
      const hh = `${String(dd.getHours()).padStart(2,'0')}:${String(dd.getMinutes()).padStart(2,'0')}`;
      const t = p.title.replace(/^[WSX]?\d*\s*[｜|]?\s*/, '');
      const tip = hh + ' ' + p.title + '（' + st.label + '）' + (p.phase ? ' · ' + p.phase : '');
      const sum = String(p.caption||'').split('\n').find(l=>l.trim()) || '';
      const hasThumb = p.platform==='ig' && (p.pages||[]).length;
      return `<button class="sp-ev sp-ev--${esc(p.status)}" data-sp-edit="${esc(p.id)}" title="${esc(tip)}">
        <span class="sp-ev-head"><span class="sp-ev-p">${p.platform==='ig'?'IG':'X'} ${esc(hh)}</span>
          <span class="sp-ev-t">${esc(t)}</span></span>
        ${hasThumb?`<span class="sp-ev-thumb" data-cal-prev="${esc(p.id)}"></span>`:''}
        ${sum?`<span class="sp-ev-sum">${esc(sum.slice(0,42))}</span>`:''}</button>`;
    }).join('');
    grid += `<div class="sp-cal-d${out?' out':''}${k===todayK?' today':''}">
      <span class="sp-cal-n">${d.getDate()}</span>${evs}</div>`;
  }
  const head = ['一','二','三','四','五','六','日'].map(w=>`<div class="sp-cal-wd">${w}</div>`).join('');
  return `${socialToolbar()}
  <div class="sp-cal-h">
    <button class="btn btn--ghost btn-sm" id="sp-cal-prev" aria-label="上個月">‹</button>
    <b>${Y} 年 ${M} 月</b>
    <button class="btn btn--ghost btn-sm" id="sp-cal-next" aria-label="下個月">›</button>
    <button class="btn btn--ghost btn-sm" id="sp-cal-today">本月</button>
    <span style="flex:1"></span>
    <button class="btn btn-sm btn--ghost" id="sp-cal-mode-week">週</button>
    <button class="btn btn-sm btn--solid" id="sp-cal-mode-month">月</button>
    <span style="color:var(--muted);font-size:.8rem">本月 ${monthCount} 則</span>
  </div>
  <div class="sp-cal-wrap"><div class="sp-cal">${head}${grid}</div></div>`;
}

function adsPlanHTML(){

  <div class="a-wrap2"><table class="a-tbl"><thead><tr><th>貼文</th><th class="num">排程</th><th>適投</th><th>層級</th><th class="num">建議預算</th><th>投放</th><th>理由</th></tr></thead><tbody>${recRows}</tbody></table></div>

function paintSocial(){
  const sub = document.getElementById('social-subnav');
  const host = document.getElementById('social-body');
  const igHost = document.getElementById('social-studio-ig');
  const xHost = document.getElementById('social-studio-x');
  if (!sub || !host) return;
  if (SOCIAL_VIEW==='list' || SOCIAL_VIEW==='calendar') SOCIAL_POSTS_VIEW = SOCIAL_VIEW;
  sub.innerHTML = socialSubnavHTML();
  sub.querySelectorAll('[data-social-sub]').forEach(b=>b.onclick=()=>{
    if (SOCIAL_VIEW==='edit' && SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;
    SOCIAL_VIEW = b.dataset.socialSub==='posts' ? SOCIAL_POSTS_VIEW : b.dataset.socialSub;
    SOCIAL_EDIT=null; SOCIAL_DIRTY=false; paintSocial();
  });
  const mode = SOCIAL_VIEW==='igstudio' ? 'ig' : SOCIAL_VIEW==='xstudio' ? 'x' : 'posts';
  host.style.display = mode==='posts' ? '' : 'none';
  igHost.style.display = mode==='ig' ? '' : 'none';
  xHost.style.display = mode==='x' ? '' : 'none';
  if (mode==='ig'){
    // 產生器 DOM 常駐（不隨貼文資料重繪），只掛載一次；display:none 期間縮放歸零，切入重算
    const el = document.getElementById('ig-studio');
    if (el && window.IGStudio && !el.dataset.mounted){ el.dataset.mounted='1'; window.IGStudio.mount(el); }
    if (window.IGStudio && typeof window.IGStudio.resize==='function') requestAnimationFrame(()=>window.IGStudio.resize());
  }
  if (mode==='x') mountXStudio();
  if (mode==='posts'){
    if (SOCIAL_POSTS === null){ host.innerHTML = '<p class="a-sub">載入貼文資料…</p>'; loadSocialPosts(); }
    else {
      host.innerHTML = SOCIAL_VIEW==='edit' && SOCIAL_EDIT ? socialEditHTML()
        : SOCIAL_VIEW==='calendar' ? socialCalendarHTML()
        : socialListHTML();
      bindSocial();
      if (SOCIAL_VIEW==='edit' && SOCIAL_EDIT && SOCIAL_EDIT.platform==='ig') renderSocialPreviews();
      if (SOCIAL_VIEW==='calendar') renderCalendarPreviews();
    }
  }
  if (TAB === 'social') {
    const want = 'social/' + (SOCIAL_VIEW==='edit' && SOCIAL_EDIT ? 'edit/'+SOCIAL_EDIT.id : SOCIAL_VIEW);
    if (routePath() !== want) history.pushState(null, '', BASE + '/' + want);
  }
}

/* ---------- X (Twitter) 貼文產生器 ---------- */
// X 加權字數：CJK／全形／emoji 以 2 計（上限 280＝中日文約 140 字）、網址一律 23
function xWeight(s){
  let n = 0;
  const rest = String(s||'').replace(/https?:\/\/\S+/g, ()=>{ n += 23; return ''; });
  for (const ch of rest){
    const cp = ch.codePointAt(0);
    n += (cp > 0xFFFF || /[ᄀ-ᇿ⺀-꓏가-힣豈-﫿︰-﹏＀-￯]/.test(ch)) ? 2 : 1;
  }
  return n;
}

function mountXStudio(){
  const el = document.getElementById('social-studio-x');
  if (!el || el.dataset.mounted) return;
  el.dataset.mounted = '1';
  el.innerHTML = `
  <p class="hint">寫一則 X 推文：即時預覽與字數檢查，可用 AI 依主題起草（需 ANTHROPIC_API_KEY）。存成草稿後到貼文總覽排程與回填成效。</p>
  <div class="xs-grid">
    <div class="xs-form">
      <label>主題（給 AI 的方向）<span style="display:flex;gap:8px"><input id="xs-topic" placeholder="例：凌晨三點的重慶南路" style="flex:1">
        <button class="btn btn--ghost btn-sm" id="xs-ai">AI 起草</button></span></label>
      <label>標題（後台管理用）<input id="xs-title" placeholder="X｜主題"></label>
      <label>中文推文<textarea id="xs-zh" rows="5"></textarea><span class="xs-count" id="xs-zh-count">0 / 280</span></label>
      <label>日文版（選填，發文時另發一則）<textarea id="xs-ja" rows="5"></textarea><span class="xs-count" id="xs-ja-count">0 / 280</span></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn--solid btn-sm" id="xs-save">存成草稿</button>
        <button class="btn btn--ghost btn-sm" id="xs-copy-zh">複製中文</button>
        <button class="btn btn--ghost btn-sm" id="xs-copy-ja">複製日文</button>
      </div>
    </div>
    <div>
      <div class="xp-card"><div class="xp-head"><span class="xp-avatar">言</span>
        <span><span class="xp-name">言文字｜emoji</span><br><span class="xp-handle">@emoji0701</span></span></div>
        <div class="xp-text" id="xs-prev-zh" style="color:var(--muted)">（中文推文預覽）</div></div>
      <div class="xp-card" id="xs-card-ja" style="display:none"><div class="xp-head"><span class="xp-avatar">言</span>
        <span><span class="xp-name">言文字｜emoji</span><br><span class="xp-handle">@emoji0701</span></span></div>
        <div class="xp-text" id="xs-prev-ja"></div></div>
    </div>
  </div>`;
  const $ = id => document.getElementById(id);
  const sync = ()=>{
    const zh = $('xs-zh').value, ja = $('xs-ja').value;
    $('xs-prev-zh').textContent = zh || '（中文推文預覽）';
    $('xs-prev-zh').style.color = zh ? '' : 'var(--muted)';
    $('xs-card-ja').style.display = ja ? '' : 'none';
    $('xs-prev-ja').textContent = ja;
    for (const [t, id] of [[zh,'xs-zh-count'],[ja,'xs-ja-count']]) {
      const w = xWeight(t);
      const n = $(id); n.textContent = `${w} / 280`; n.classList.toggle('over', w > 280);
    }
  };
  $('xs-zh').addEventListener('input', sync);
  $('xs-ja').addEventListener('input', sync);
  $('xs-ai').onclick = async ()=>{
    const topic = $('xs-topic').value.trim();
    if (!topic) return toast('請先輸入主題');
    $('xs-ai').disabled = true; $('xs-ai').textContent = '起草中…';
    try {
      const { draft } = await api('/admin/x/compose', { method:'POST', body:{ topic } });
      $('xs-title').value = draft.title || $('xs-title').value;
      $('xs-zh').value = draft.caption || '';
      $('xs-ja').value = draft.caption_ja || '';
      sync(); toast('AI 草稿完成，請人工校閱');
    } catch(e){ toast(e.message); }
    finally { $('xs-ai').disabled = false; $('xs-ai').textContent = 'AI 起草'; }
  };
  $('xs-save').onclick = async ()=>{
    const zh = $('xs-zh').value.trim();
    if (!zh) return toast('請先寫中文推文');
    if (xWeight(zh) > 280 || xWeight($('xs-ja').value) > 280) return toast('超過 280 字數上限，請縮短');
    const title = $('xs-title').value.trim() || ('X｜' + zh.slice(0, 12));
    try {
      await api('/admin/social/posts', { method:'POST', body:{
        platform:'x', post_type:'text', status:'draft', title, caption: zh, caption_ja: $('xs-ja').value.trim() } });
      SOCIAL_POSTS = null;   // 下次進貼文總覽重新載入
      toast('已存成草稿，到貼文總覽排程');
    } catch(e){ toast(e.message); }
  };
  const copy = async (t, msg)=>{ if(!t) return toast('沒有內容可複製');
    try { await navigator.clipboard.writeText(t); toast(msg); } catch(_) { toast('複製失敗'); } };
  $('xs-copy-zh').onclick = ()=>copy($('xs-zh').value, '已複製中文推文');
  $('xs-copy-ja').onclick = ()=>copy($('xs-ja').value, '已複製日文推文');
}

  const cur = plan.release.find(r=>r.current);
  const spent = (ADS_CAMPS||[]).reduce((s,c)=>s+(Number(c.spent)||0),0);

  if (!host) return;
  if (SOCIAL_POSTS === null || ADS_CAMPS === null){ host.innerHTML='<p class="a-sub">載入資料…</p>'; loadAdsData(); return; }
  host.innerHTML = adsDashHTML() + adsCampaignsHTML() + adsPlanHTML();
  bindAds();
}

function adsBlankCamp(postId){
  const p2=n=>String(n).padStart(2,'0'), t=new Date();
  return { id:'', post_id: postId||'', layer:'awareness', status:'planned',
    start_date:`${t.getFullYear()}-${p2(t.getMonth()+1)}-${p2(t.getDate())}`, end_date:'', budget:0, spent:0, metrics:{}, notes:'' };
}

function bindAds(){
  const host = document.getElementById('ads-body');
  if (!host) return;
  const on = (id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };
  on('ads-new','click',()=>{ ADS_EDIT = adsBlankCamp(); paintAds(); });
  host.querySelectorAll('[data-ads-new-for]').forEach(b=>b.onclick=()=>{ ADS_EDIT = adsBlankCamp(b.dataset.adsNewFor); paintAds(); });
  host.querySelectorAll('[data-ads-edit]').forEach(b=>b.onclick=()=>{
    const c = (ADS_CAMPS||[]).find(x=>x.id===b.dataset.adsEdit); if(!c) return;
    ADS_EDIT = JSON.parse(JSON.stringify(c)); ADS_EDIT.metrics = ADS_EDIT.metrics||{}; paintAds();
  });
  host.querySelectorAll('[data-ads-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定刪除此投放紀錄？')) return;
    try { await api('/admin/ads/campaigns/'+b.dataset.adsDel,{method:'DELETE'});
      ADS_CAMPS = ADS_CAMPS.filter(x=>x.id!==b.dataset.adsDel);
      if (ADS_EDIT && ADS_EDIT.id===b.dataset.adsDel) ADS_EDIT=null;
      toast('已刪除'); paintAds();
    } catch(e){ toast(e.message); }
  });
  on('ac-cancel','click',()=>{ ADS_EDIT=null; paintAds(); });
  on('ac-save','click',async()=>{
    const v = id => document.getElementById(id).value;
    const metrics = {};
    if (Number(v('ac-reach'))) metrics.reach = Number(v('ac-reach'));
    if (Number(v('ac-clicks'))) metrics.clicks = Number(v('ac-clicks'));
    try {
      await api('/admin/ads/campaigns',{method:'POST',body:{
        id: ADS_EDIT.id || undefined, post_id: v('ac-post'), layer: v('ac-layer'), status: v('ac-status'),
        start_date: v('ac-start'), end_date: v('ac-end'),
        budget: Number(v('ac-budget'))||0, spent: Number(v('ac-spent'))||0, metrics, notes: v('ac-notes') }});
      ADS_EDIT = null; ADS_CAMPS = null;   // 重新載入取回正規化後資料
      toast('已儲存投放紀錄'); paintAds();
    } catch(e){ toast(e.message); }
  });
  // 建議表中的貼文連結 → 跳社群經營編輯（路徑路由處理）
  host.querySelectorAll('[data-sp-edit]').forEach(b=>b.onclick=(ev)=>{
    ev.preventDefault(); go('social/edit/' + b.dataset.spEdit);
  });
}

// page 兼容：seed 巢狀 {layout,fields} → renderSpec 攤平格式
function spNormPage(pg){
  if (!pg || pg.category) return pg;
  const lid = String(pg.layout||'03a');
  return Object.assign({category:lid.slice(0,2), variant:lid.slice(2)||'a', format:pg.format||'portrait'}, pg.fields||{});
}

/* 行事曆縮圖：每格 IG 貼文以首頁版型即時渲染（縮放後約 100px 寬） */
function renderCalendarPreviews(){
  if (!window.IGStudio || !window.IGStudio.renderSpec) return;
  document.querySelectorAll('[data-cal-prev]').forEach(box=>{
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===box.dataset.calPrev);
    const pg = p && (p.pages||[])[0];
    if (!pg) return;
    try {
      const node = window.IGStudio.renderSpec(spNormPage(pg));
      const w = box.clientWidth || 110;
      node.style.transformOrigin = 'top left';
      node.style.transform = `scale(${w/1080})`;
      box.innerHTML = '';
      box.appendChild(node);
    } catch(_) { box.textContent = ''; }
  });
}

function renderSocialPreviews(){
  if (!window.IGStudio || !window.IGStudio.renderSpec) return;
  document.querySelectorAll('[data-sp-prev]').forEach(box=>{
    const i = Number(box.dataset.spPrev);
    const pg = (SOCIAL_EDIT.pages||[])[i];
    if (!pg) return;
    try {
      const node = window.IGStudio.renderSpec(spNormPage(pg));
      const w = 150, scale = w/1080;
      box.innerHTML = '';
      box.style.width = w+'px';
      box.style.height = Math.round((pg.format==='square'?1080:1350)*scale)+'px';
      node.style.transformOrigin='top left';
      node.style.transform=`scale(${scale})`;
      box.appendChild(node);
    } catch(e){ box.textContent = '預覽失敗'; }
  });
}

function socialCollectEdit(){
  const p = SOCIAL_EDIT;
  const val = id => { const el=document.getElementById(id); return el?el.value:''; };
  p.title = val('sp-e-title').trim();
  p.platform = val('sp-e-platform');
  p.post_type = val('sp-e-type');
  p.status = val('sp-e-status');
  p.scheduled_at = val('sp-e-sched');
  p.series = val('sp-e-series');
  p.phase = val('sp-e-phase').trim();
  p.audience = val('sp-e-aud').trim();
  p.caption = val('sp-e-caption');
  const enEl = document.getElementById('sp-e-caption-en');
  if (enEl) p.caption_en = enEl.value;
  const jaEl = document.getElementById('sp-e-caption-ja');
  if (jaEl) p.caption_ja = jaEl.value;
  p.hashtags = val('sp-e-tags').trim();
  p.cta = val('sp-e-cta').trim();
  p.external_url = val('sp-e-url').trim();
  p.published_at = val('sp-e-pub');
  p.notes = val('sp-e-notes');
  const metrics = {};
  document.querySelectorAll('[data-sp-metric]').forEach(inp=>{
    if (inp.value !== '') metrics[inp.dataset.spMetric] = Number(inp.value);
  });
  p.metrics = metrics;
}

async function socialSave(){
  socialCollectEdit();
  const p = SOCIAL_EDIT;
  if (!p.title){ toast('請輸入貼文標題'); return; }
  // 儲存期間鎖定表單：避免輸入落在送出快照之後又被 dirty=false 掩蓋
  const locked = [...document.querySelectorAll('#social-body input,#social-body textarea,#social-body select,#social-body button')];
  locked.forEach(el=>el.disabled=true);
  try {
    const body = Object.assign({}, p, { id: p.id || undefined });
    const r = await api('/admin/social/posts', { method:'POST', body });
    if (!p.id) p.id = r.id;
    SOCIAL_DIRTY = false;
    const { posts } = await api('/admin/social/posts');
    SOCIAL_POSTS = posts;
    toast('已儲存貼文');
    paintSocial();   // 成功路徑重繪即恢復可編輯
  } catch(e){ toast(e.message); locked.forEach(el=>el.disabled=false); }
}

async function socialExportPngs(){
  const p = SOCIAL_EDIT;
  if (!window.IGStudio || !window.IGStudio.exportSpecPng) { toast('匯出元件未載入'); return; }
  socialCollectEdit();
  const safe = p.title.replace(/[\/\\?%*:|"<>]/g,'').slice(0,40) || '貼文';
  let okN = 0;
  for (let i=0;i<(p.pages||[]).length;i++){
    try {
      await window.IGStudio.exportSpecPng(p.pages[i], `言文字_IG_${safe}_p${String(i+1).padStart(2,'0')}.png`);
      okN++;
    } catch(e){ toast(`第 ${i+1} 頁匯出失敗：${e.message}`); return; }
  }
  toast(`已匯出 ${okN} 頁 PNG`);
}

function socialNewPost(platform){
  SOCIAL_EDIT = {
    id:'', platform, post_type: platform==='x'?'text':'carousel', status:'draft',
    title:'', caption:'', caption_en:'', caption_ja:'', hashtags: platform==='ig'?'#言文字 #台灣人才聚落':'',
    pages: platform==='ig'?[{category:'03',variant:'a',format:'portrait',q_text:'',q_sub:'',q_by:''}]:[],
    images:[], scheduled_at:'', published_at:'', external_url:'',
    series:'', phase:'', cta:'', audience:'', metrics:{}, notes:'',
  };
  SOCIAL_DIRTY = true; SOCIAL_VIEW = 'edit';
  paintSocial();
}

function bindSocial(){
  const host = document.getElementById('social-body');
  if (!host) return;
  const on = (id,ev,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener(ev,fn); };

  host.querySelectorAll('[data-social-view]').forEach(b=>b.onclick=()=>{
    if (SOCIAL_VIEW==='edit' && SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;
    SOCIAL_VIEW=b.dataset.socialView; SOCIAL_EDIT=null; SOCIAL_DIRTY=false; paintSocial();
  });
  on('sp-f-platform','change',e=>{ SOCIAL_FILTER.platform=e.target.value; paintSocial(); });
  on('sp-f-status','change',e=>{ SOCIAL_FILTER.status=e.target.value; paintSocial(); });
  on('sp-f-q','input',e=>{ SOCIAL_FILTER.q=e.target.value;
    document.querySelectorAll('#sp-body tr').forEach(tr=>{ const qq=(tr.dataset.q||'').toLowerCase();
      tr.style.display = !e.target.value.trim() || qq.includes(e.target.value.trim().toLowerCase()) ? '' : 'none'; }); });
  on('sp-new-ig','click',()=>socialNewPost('ig'));
  on('sp-new-x','click',()=>socialNewPost('x'));
  const spShiftWeek = n => { const b = SOCIAL_CAL_WEEK ? spDate(SOCIAL_CAL_WEEK) : new Date(); b.setDate(b.getDate()+n*7); return spDay(b); };
  on('sp-cal-prev','click',()=>{ if (SOCIAL_CAL_MODE==='week') SOCIAL_CAL_WEEK = spShiftWeek(-1); else SOCIAL_CAL_MONTH = spShiftYM(socialCalYM(), -1); paintSocial(); });
  on('sp-cal-next','click',()=>{ if (SOCIAL_CAL_MODE==='week') SOCIAL_CAL_WEEK = spShiftWeek(1); else SOCIAL_CAL_MONTH = spShiftYM(socialCalYM(), 1); paintSocial(); });
  on('sp-cal-today','click',()=>{ if (SOCIAL_CAL_MODE==='week') SOCIAL_CAL_WEEK = null; else SOCIAL_CAL_MONTH = spYM(new Date()); paintSocial(); });
  on('sp-cal-mode-week','click',()=>{ SOCIAL_CAL_MODE='week'; SOCIAL_CAL_WEEK=null; paintSocial(); });
  on('sp-cal-mode-month','click',()=>{ SOCIAL_CAL_MODE='month'; paintSocial(); });

  host.querySelectorAll('[data-sp-edit]').forEach(b=>b.onclick=(ev)=>{
    ev.preventDefault();
    const p = (SOCIAL_POSTS||[]).find(x=>x.id===b.dataset.spEdit); if(!p) return;
    SOCIAL_EDIT = JSON.parse(JSON.stringify(p));
    SOCIAL_EDIT.metrics = SOCIAL_EDIT.metrics||{};
    SOCIAL_EDIT.pages = SOCIAL_EDIT.pages||[];
    SOCIAL_EDIT.images = SOCIAL_EDIT.images||[];
    SOCIAL_VIEW='edit'; SOCIAL_DIRTY=false; paintSocial();
    document.querySelector('[data-panel="social"]')?.scrollIntoView({behavior:'smooth',block:'start'});
  });
  host.querySelectorAll('[data-sp-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('確定刪除此貼文？')) return;
    try { await api('/admin/social/posts/'+b.dataset.spDel,{method:'DELETE'});
      SOCIAL_POSTS = SOCIAL_POSTS.filter(x=>x.id!==b.dataset.spDel);
      toast('已刪除貼文'); paintSocial();
    } catch(e){ toast(e.message); }
  });

  if (SOCIAL_VIEW!=='edit' || !SOCIAL_EDIT) return;

  /* ---- 編輯器 ---- */
  // 每次輸入即回寫 SOCIAL_EDIT：任何 refresh() 整頁重繪都從最新狀態重建，不遺失
  const markDirty = ()=>{ socialCollectEdit(); SOCIAL_DIRTY=true; };
  host.querySelectorAll('input,textarea,select').forEach(el=>el.addEventListener('input',markDirty));
  on('sp-back','click',()=>{
    if (SOCIAL_DIRTY && !confirm('有未儲存的編輯，確定離開？')) return;
    SOCIAL_VIEW='list'; SOCIAL_EDIT=null; SOCIAL_DIRTY=false; paintSocial();
  });
  on('sp-save','click',socialSave);
  on('sp-del','click',async()=>{
    if(!confirm('確定刪除此貼文？')) return;
    try { await api('/admin/social/posts/'+SOCIAL_EDIT.id,{method:'DELETE'});
      SOCIAL_POSTS = SOCIAL_POSTS.filter(x=>x.id!==SOCIAL_EDIT.id);
      SOCIAL_VIEW='list'; SOCIAL_EDIT=null; SOCIAL_DIRTY=false;
      toast('已刪除貼文'); paintSocial();
    } catch(e){ toast(e.message); }
  });
  on('sp-copy','click',async()=>{
    socialCollectEdit();
    const p2 = SOCIAL_EDIT;
    // IG：中英同貼合併；X：中文版（日文版用「複製日文」另發）
    const text = p2.platform==='ig'
      ? [p2.caption, p2.caption_en, p2.hashtags].filter(Boolean).join('\n\n')
      : p2.caption + (p2.hashtags?'\n\n'+p2.hashtags:'');
    try { await navigator.clipboard.writeText(text); toast(p2.platform==='ig'?'已複製中英文案＋hashtags':'已複製中文版'); }
    catch(e){ toast('複製失敗：'+e.message); }
  });
  on('sp-copy-ja','click',async()=>{
    socialCollectEdit();
    try { await navigator.clipboard.writeText(SOCIAL_EDIT.caption_ja||''); toast('已複製日文版'); }
    catch(e){ toast('複製失敗：'+e.message); }
  });
  on('sp-export','click',socialExportPngs);
  on('sp-e-caption','input',e=>{
    const el=document.getElementById('sp-xlen');
    if (el) el.textContent = `中文版全形計 2：${socialXLen(e.target.value)}／280`;
  });
  on('sp-e-caption-ja','input',e=>{
    const el=document.getElementById('sp-xlen-ja');
    if (el) el.textContent = `日文版全形計 2：${socialXLen(e.target.value)}／280`;
  });
  on('sp-e-platform','change',()=>{ socialCollectEdit(); paintSocial(); });
  on('sp-e-upload','change',async e=>{
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const ed = SOCIAL_EDIT;   // 上傳期間可能切換貼文：完成時比對仍是同一篇才寫入
    try {
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/admin/upload/social',{ method:'POST', headers: token?{Authorization:'Bearer '+token}:{}, body: fd });
      const data = await r.json().catch(()=>({}));
      if (!r.ok) throw new Error(data.error || ('上傳失敗（'+r.status+'）'));
      if (!SOCIAL_EDIT || SOCIAL_EDIT !== ed) { toast('已離開原貼文，圖片未加入（'+data.url+'）'); return; }
      socialCollectEdit();
      SOCIAL_EDIT.images.push(data.url);
      SOCIAL_DIRTY = true;
      toast('已上傳，記得儲存貼文'); paintSocial();
    } catch(err){ toast(err.message); } finally { e.target.value=''; }
  });
  host.querySelectorAll('[data-sp-imgdel]').forEach(b=>b.onclick=()=>{
    socialCollectEdit();
    SOCIAL_EDIT.images.splice(Number(b.dataset.spImgdel),1);
    SOCIAL_DIRTY=true; paintSocial();
  });

  /* 頁面編輯 */
  on('sp-pgadd','click',()=>{
    socialCollectEdit();
    SOCIAL_EDIT.pages.push({category:'03',variant:'a',format:'portrait',q_text:'',q_sub:'',q_by:''});
    SOCIAL_DIRTY=true; paintSocial();
  });
  host.querySelectorAll('[data-sp-pglayout]').forEach(sel=>sel.onchange=()=>{
    socialCollectEdit();
    const i=Number(sel.dataset.spPglayout), lid=sel.value;
    const pg=SOCIAL_EDIT.pages[i];
    SOCIAL_EDIT.pages[i]=Object.assign({},pg,{category:lid.slice(0,2),variant:lid.slice(2)});
    SOCIAL_DIRTY=true; paintSocial();
  });
  host.querySelectorAll('[data-sp-pg]').forEach(inp=>inp.addEventListener('input',()=>{
    const i=Number(inp.dataset.spPg), k=inp.dataset.spK;
    if (SOCIAL_EDIT.pages[i]) SOCIAL_EDIT.pages[i][k]=inp.value;
    SOCIAL_DIRTY=true;
    // 只重繪這一頁的預覽
    const box=document.querySelector(`[data-sp-prev="${i}"]`);
    if (box && window.IGStudio && window.IGStudio.renderSpec){
      try { const node=window.IGStudio.renderSpec(spNormPage(SOCIAL_EDIT.pages[i]));
        node.style.transformOrigin='top left'; node.style.transform='scale('+(150/1080)+')';
        box.innerHTML=''; box.appendChild(node);
      } catch(e){}
    }
  }));
  const movePage=(i,dir)=>{
    socialCollectEdit();
    const pgs=SOCIAL_EDIT.pages, j=i+dir;
    if (j<0||j>=pgs.length) return;
    [pgs[i],pgs[j]]=[pgs[j],pgs[i]];
    SOCIAL_DIRTY=true; paintSocial();
  };
  host.querySelectorAll('[data-sp-pgup]').forEach(b=>b.onclick=()=>movePage(Number(b.dataset.spPgup),-1));
  host.querySelectorAll('[data-sp-pgdn]').forEach(b=>b.onclick=()=>movePage(Number(b.dataset.spPgdn),1));
  host.querySelectorAll('[data-sp-pgdel]').forEach(b=>b.onclick=()=>{
    if(!confirm('刪除此頁？')) return;
    socialCollectEdit();
    SOCIAL_EDIT.pages.splice(Number(b.dataset.spPgdel),1);
    SOCIAL_DIRTY=true; paintSocial();
  });
}

async function ensureIgScripts() {
  if (window.IGStudio) return;
  const load = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error(src));
    document.head.appendChild(s);
  });
  await load('/ig-studio-lib.js');
  await load('/vendor/html-to-image.js');
  await load('/menu-data.js');
  await load('/ig-studio.js');
  await load('/social-ads-lib.js');
}

async function refresh(){ const d=await api('/state'); await ensureIgScripts(); render(d); applyRoute(); }

async function main(){
  if (!token) return renderLogin();
  try {
    const d = await api('/state');
    if (d.role !== 'admin') return renderLogin('此 Google 帳號沒有管理員權限。請以超管或已授權的管理員帳號登入。');
    await ensureIgScripts();
    render(d);
    applyRoute();
  } catch(e){
    if (String(e.message).includes('登入') || String(e.message).includes('401')) { localStorage.removeItem(KEY); localStorage.removeItem('tth_name'); return renderLogin(); }
    app.innerHTML = `<p class="a-center">暫時無法連線：${esc(e.message)}<br><button class="btn btn--ghost btn-sm" style="margin-top:1rem" onclick="location.reload()">重新整理</button></p>`;
  }
}
main();
</script>
