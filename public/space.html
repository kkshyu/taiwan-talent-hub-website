<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>document.documentElement.className='js'</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1B1A17">
<title>空間介紹 · 言文字｜台灣人才聚落</title>
<meta name="description" content="言文字｜台灣人才聚落空間介紹：一樓在咖啡（at cafe）與三點水（3AM）、二樓等等空間（Stay Square）24 小時看書休憩（含獨立膠囊空間）與電動漫畫娛樂室、三樓等等空間挑高六米共享辦公，另有附屬設施（淋浴間、洗衣間、吸菸區）。">
<link rel="canonical" href="https://www.emoji.tw/space">
<link rel="alternate" hreflang="zh-Hant" href="https://www.emoji.tw/space">
<link rel="alternate" hreflang="en" href="https://www.emoji.tw/en/space">
<link rel="alternate" hreflang="ja" href="https://www.emoji.tw/ja/space">
<link rel="alternate" hreflang="x-default" href="https://www.emoji.tw/space">
<meta property="og:locale" content="zh_TW">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:locale:alternate" content="ja_JP">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/nav.css">
<link rel="stylesheet" href="/space-dir.css">
<script defer src="/nav.js"></script>
</head>
<body>
<a href="#content" class="skip-link">跳至主要內容</a>

<!--SITE_HEADER-->

<main id="content">

  <section class="space-hero">
    <div class="wrap">
      <span class="eyebrow">言文字｜空間</span>
      <h1>三層樓的<em class="swash">實體聚落</em></h1>
      <p class="lede">三層樓聚落＋附屬設施（淋浴間、洗衣間、吸菸區），約 85 坪（約 281 m²）。讓你平常不會遇到的人，在台北車站旁相遇。</p>
      <p style="margin-top:24px">想帶社群來這裡辦活動？</p>
      <a class="btn btn--solid" href="/event-application" style="margin-top:12px">申請舉辦活動 →</a>
      <figure class="hero-media" id="media-hero" hidden>
        <img src="" alt="台灣人才聚落建築外觀">
      </figure>
    </div>
  </section>

  <section class="space-dir" id="directory" aria-label="樓層示意">
    <div id="space-dir-root"></div>
  </section>

  <div class="space-panel space-panel--accordion" id="floor-detail" hidden>
    <div class="space-panel__inner">
      <div class="space-panel__head">
        <span class="space-panel__no" data-panel-no>1F</span>
        <h2 class="space-panel__title" data-panel-title>在咖啡（at cafe）／三點水（3AM）</h2>
        <button type="button" class="space-panel__close" data-space-close>收合</button>
      </div>
      <figure class="floor-media" data-panel-media hidden>
        <img src="" alt="">
      </figure>
      <div class="md-content" data-panel-md></div>
      <div class="space-panel__menu" data-panel-menu hidden>
        <h3 class="space-panel__menu-title" data-panel-menu-title>餐飲菜單 Menu</h3>
        <div data-panel-menu-body></div>
      </div>
    </div>
  </div>

</main>

<!--SITE_FOOTER-->

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/menu-lib.js"></script>
<script src="/space-dir.js"></script>
<script>
(function() {
  var htmlLang = (document.documentElement.getAttribute('lang') || 'zh').toLowerCase();
  var LANG = htmlLang.indexOf('en') === 0 ? 'en' : (htmlLang.indexOf('ja') === 0 ? 'ja' : 'zh');
  var FAIL_TEXT = { zh: '無法載入資料。', en: 'Could not load content.', ja: '読み込めませんでした。' }[LANG];
  var EMPTY_MENU = { zh: '目前尚未提供菜單資料。', en: 'Menu coming soon.', ja: 'メニュー準備中。' }[LANG];

  var dir = new SpaceDir({
    lang: LANG,
    root: document.getElementById('space-dir-root'),
    panel: document.getElementById('floor-detail'),
  });

  fetch('/api/public')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var content = (d && d.content) || {};
      var hero = document.getElementById('media-hero');
      var heroUrl = String(content.space_hero_image || '').trim();
      if (hero && heroUrl) {
        hero.querySelector('img').src = heroUrl;
        hero.hidden = false;
      }
      var items = [];
      if (content.menu && window.MenuLib) {
        var doc = window.MenuLib.parseMenuDoc(content.menu);
        items = window.MenuLib.sortItems(window.MenuLib.publishedOnly(doc));
      }
      dir.setData(content, window.MenuLib.renderMenuHtml(items, LANG, EMPTY_MENU));
      dir.openFromHash();
    })
    .catch(function (err) {
      console.error(err);
      dir.setData({}, '<p class="menu-empty">' + FAIL_TEXT + '</p>');
    });

  window.addEventListener('hashchange', function () { dir.openFromHash(); });
})();
</script>
</body>
</html>
