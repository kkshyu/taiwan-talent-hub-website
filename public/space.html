<main id="content">

  <section class="space-hero">
    <div class="wrap">
      <span class="eyebrow">台北車站旁 · 一棟三種用法</span>
      <h1>工作、休息、吃飯與活動，<em class="swash">都在同一棟</em></h1>
      <p class="lede">預計 2026 年 11 月 1 日正式開幕。開幕後，1F 可用餐或約客戶喝咖啡，不需會員；2F 是會員休息、淋浴與娛樂空間；3F 可工作，也接受社群講座、工作坊與交流活動申請。</p>
      <p style="margin-top:24px">社群主辦人可填 3F 場地申請；企業、團隊或客戶包場請直接來信。</p>
      <div class="space-hero__actions">
        <a class="btn btn--solid" href="#directory">看哪一層適合我 →</a>
        <a class="btn btn--ghost" href="/event-application">申請 3F 社群活動</a>
        <a class="btn btn--ghost" href="mailto:us@emoji.tw?subject=3F%20business%20venue%20enquiry">洽詢企業／團隊包場</a>
      </div>
      <figure class="hero-media" id="media-hero">
        <img src="/assets/space/facade-current.jpg" alt="台灣人才聚落建物外觀現況" width="1200" height="900" decoding="async" fetchpriority="high">
        <figcaption>建物外觀現況（2026.08，門面更新前）</figcaption>
      </figure>
    </div>
  </section>

  <section class="space-dir" id="directory" aria-label="樓層示意">
    <div id="space-dir-root"></div>
  </section>

  <div class="space-panel space-panel--accordion" id="floor-detail" hidden>
    <div class="space-panel__inner">
      <div class="space-panel__head">
        <span class="space-panel__no" data-panel-no>1F</span>
        <h2 class="space-panel__title" data-panel-title>在咖啡（at cafe）／三點水（3AM）</h2>
        <button type="button" class="space-panel__close" data-space-close>收合</button>
      </div>
      <figure class="floor-media" data-panel-media hidden>
        <img src="" alt="">
        <figcaption></figcaption>
      </figure>
      <div class="space-panel__facts" data-panel-facts></div>
      <div class="md-content" data-panel-md></div>
      <div class="space-panel__menu" data-panel-menu hidden>
        <h3 class="space-panel__menu-title" data-panel-menu-title>餐飲菜單 Menu</h3>
        <div data-panel-menu-body></div>
      </div>
    </div>
  </div>

</main>

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/menu-lib.js"></script>
<script src="/space-dir.js"></script>
<script>
(function() {
  var htmlLang = (document.documentElement.getAttribute('lang') || 'zh').toLowerCase();
  var LANG = htmlLang.indexOf('en') === 0 ? 'en' : (htmlLang.indexOf('ja') === 0 ? 'ja' : 'zh');
  var FAIL_TEXT = { zh: '無法載入資料。', en: 'Could not load content.', ja: '読み込めませんでした。' }[LANG];
  var EMPTY_MENU = { zh: '目前尚未提供菜單資料。', en: 'Menu coming soon.', ja: 'メニュー準備中。' }[LANG];

  var dir = new SpaceDir({
    lang: LANG,
    root: document.getElementById('space-dir-root'),
    panel: document.getElementById('floor-detail'),
  });

  fetch('/api/public')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var content = (d && d.content) || {};
      var hero = document.getElementById('media-hero');
      var heroUrl = String(content.space_hero_image || '').trim();
      if (hero && heroUrl) {
        hero.querySelector('img').src = heroUrl;
        var heroCaption = hero.querySelector('figcaption');
        if (heroCaption) heroCaption.textContent = '空間影像';
      }
      var items = [];
      if (content.menu && window.MenuLib) {
        var doc = window.MenuLib.parseMenuDoc(content.menu);
        items = window.MenuLib.sortItems(window.MenuLib.publishedOnly(doc));
      }
      dir.setData(content, window.MenuLib.renderMenuHtml(items, LANG, EMPTY_MENU));
      dir.openFromHash();
    })
    .catch(function (err) {
      console.error(err);
      dir.setData({}, '<p class="menu-empty">' + FAIL_TEXT + '</p>');
    });

  window.addEventListener('hashchange', function () { dir.openFromHash(); });
})();
</script>
