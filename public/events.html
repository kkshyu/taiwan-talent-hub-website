<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script>
(function(){var m=location.pathname.match(/^\/(en|ja)(\/|$)/);if(m)document.documentElement.lang=m[1]==='ja'?'ja':'en';})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動｜言文字・台灣人才聚落</title>
<meta name="description" content="查看並報名言文字・台灣人才聚落的公開與私人活動。">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/nav.css">
<script defer src="/nav.js"></script>
<style>
  .ev-main{max-width:1080px;margin:0 auto;padding:72px 24px 104px;min-height:65vh}
  .ev-hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;margin-bottom:42px}
  .ev-kicker{letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-size:1rem;margin:0 0 10px}
  .ev-h1{font-family:var(--serif);font-size:clamp(2.3rem,6vw,4.8rem);font-weight:600;line-height:1;margin:0}
  .ev-intro{color:var(--ink-soft);max-width:520px;line-height:1.8;margin:18px 0 0}
  .ev-apply{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:24px;border:1px solid var(--ink);border-radius:var(--radius-sm);margin-bottom:36px;background:var(--paper-alt)}
  .ev-apply h2{font-size:1.4rem;margin:0 0 8px}.ev-apply p{color:var(--muted)}.ev-apply__actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}.ev-apply .btn{flex-shrink:0;background:var(--accent);color:var(--ink)}.ev-apply .btn--ghost{background:var(--paper)}.ev-apply[hidden]{display:none}
  @media(max-width:760px){.ev-apply{align-items:flex-start;flex-direction:column}.ev-apply__actions{width:100%;flex-direction:column}.ev-apply .btn{width:100%;justify-content:center}}
  .ev-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .ev-card,.ev-detail{border:1px solid var(--ink);border-radius:20px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
  .ev-card a{display:block;color:inherit;text-decoration:none;padding:26px;height:100%;box-sizing:border-box}
  .ev-card h2{font-family:var(--serif);font-size:1.55rem;margin:8px 0 12px}
  .ev-meta{color:var(--muted);line-height:1.65;font-size:1rem}
  .ev-desc{color:var(--ink-soft);line-height:1.75;white-space:pre-wrap;margin:16px 0 0}
  .ev-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
  .ev-price{font-weight:700;font-variant-numeric:tabular-nums}
  .ev-card__cta{display:block;margin-top:14px;font-weight:700;text-decoration:underline;text-underline-offset:4px}
  .ev-pill{display:inline-flex;border:1px solid var(--ink);border-radius:999px;padding:.28em .72em;font-size:1rem;background:var(--accent)}
  .ev-pill.private{background:var(--paper)}
  .ev-detail{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr)}
  .ev-copy{padding:clamp(28px,5vw,58px)}
  .ev-side{padding:32px;border-left:1px solid var(--ink);background:rgba(255,222,52,.1)}
  .ev-side .btn{width:100%;justify-content:center;box-sizing:border-box;margin-top:10px}
  .ev-note{font-size:1rem;color:var(--muted);line-height:1.65;margin-top:14px}
  .ev-qr{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
  .ev-qr img{display:block;margin:12px auto;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
  .ev-back{display:inline-block;margin-bottom:24px;color:var(--ink-soft);text-underline-offset:4px}
  .ev-empty{padding:42px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);text-align:center;grid-column:1/-1}
  .ev-empty:has(.btn)::before{content:"";display:block;width:112px;height:76px;margin:0 auto 16px;background:url('/cis/assets/moji/moji-meet.svg') center/contain no-repeat}
  .ev-empty p{margin:0 0 18px}
  .ev-toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--paper);padding:.75em 1.2em;border-radius:12px;max-width:min(420px,92vw)}
  .ev-toast[hidden]{display:none}
  @media(max-width:760px){.ev-main{padding:44px 18px 80px}.ev-hero{grid-template-columns:1fr}.ev-grid{grid-template-columns:1fr}.ev-detail{grid-template-columns:1fr}.ev-side{border-left:0;border-top:1px solid var(--ink)}}
</style>
</head>
<body>
<!--SITE_HEADER-->
<main class="ev-main" id="content">
  <div id="ev-app"><div class="ev-empty">載入活動中…</div></div>
  <section class="ev-apply" id="ev-apply"><div><h2 id="ev-apply-title">辦社群講座、工作坊或交流活動</h2><p id="ev-apply-copy">社群主辦人可提出 3F 場地申請；送出申請不代表場地已保留。</p></div><div class="ev-apply__actions"><a class="btn" id="ev-apply-link" href="/event-application">填寫 3F 社群活動申請 →</a><a class="btn btn--ghost" id="ev-business-link" href="mailto:us@emoji.tw?subject=3F%20business%20venue%20enquiry">企業／團隊包場請來信 →</a></div></section>
</main>
<div class="ev-toast" id="ev-toast" hidden role="status" aria-live="polite"></div>
<!--SITE_FOOTER-->
<script src="/vendor/qrcode.min.js"></script>
<script>
'use strict';
const TOKEN_KEY='tth_token';
const callbackHash=new URLSearchParams(location.hash.slice(1));
let token=callbackHash.get('token')||'';
try {
  if(token){localStorage.setItem(TOKEN_KEY,token);localStorage.removeItem('tth_name');}
  else token=localStorage.getItem(TOKEN_KEY)||'';
} catch {} // 私密模式仍可使用這次登入回傳的 token。
if(callbackHash.has('token'))history.replaceState(null,'',location.pathname+location.search);
const lang=(location.pathname.match(/^\/(en|ja)(\/|$)/)||[, 'zh'])[1];
const locale=lang==='zh'?'zh-TW':lang==='ja'?'ja-JP':'en-US';
const base=lang==='zh'?'':'/'+lang;
const T={
  zh:{title:'活動',intro:'查看講座、交流晚餐與主題活動，選擇場次並完成報名。公開活動會列在這裡；私人活動由主辦方分享專屬連結。',details:'查看詳情／報名',empty:'目前沒有開放報名的公開活動。',follow:'追蹤 Instagram，取得活動消息',back:'← 回到所有活動',private:'私人活動',public:'公開活動',free:'免費',capacity:(n,c)=>c>0?`已報名 ${n}／${c} 人`:`已報名 ${n} 人`,time:'時間待定',place:'地點待定',login:'登入後報名',register:'立即報名',pay:'前往付款',resume:'繼續付款',ticket:'顯示活動票券',cancel:'取消報名',full:'名額已滿',paid:'付款完成，活動票券已成立。',canceled:'付款已取消，名額會保留至結帳連結到期。',checked:'已完成簽到',pending:'等待付款',privacy:'報名時會使用你的 Google 姓名與 Email，僅供活動報名、付款核對與現場簽到。',notFound:'找不到這個活動。',error:'目前無法載入活動，請稍後再試。'},
  en:{title:'Events',intro:'Browse talks, networking dinners and themed events, then choose a session and register. Public events appear here; private events are shared by direct link.',details:'View details / register',empty:'No public events are open right now.',follow:'Follow Instagram for event updates',back:'← All events',private:'Private event',public:'Public event',free:'Free',capacity:(n,c)=>c>0?`${n} / ${c} registered`:`${n} registered`,time:'Time TBA',place:'Location TBA',login:'Sign in to register',register:'Register',pay:'Continue to payment',resume:'Resume payment',ticket:'Show event ticket',cancel:'Cancel registration',full:'Sold out',paid:'Payment confirmed. Your event ticket is ready.',canceled:'Payment was canceled. Your spot remains held until checkout expires.',checked:'Checked in',pending:'Payment pending',privacy:'We use your Google name and email only for event registration, payment reconciliation, and check-in.',notFound:'Event not found.',error:'Events are temporarily unavailable.'},
  ja:{title:'イベント',intro:'講座、交流ディナー、テーマイベントを確認し、参加する回を選んでお申し込みください。公開イベントは一覧に表示され、非公開イベントは主催者から専用リンクで共有されます。',details:'詳細・申込を見る',empty:'現在、申込受付中の公開イベントはありません。',follow:'Instagramでイベント情報を見る',back:'← イベント一覧',private:'非公開イベント',public:'公開イベント',free:'無料',capacity:(n,c)=>c>0?`申込 ${n}／${c} 名`:`申込 ${n} 名`,time:'日時未定',place:'場所未定',login:'ログインして申込',register:'申し込む',pay:'支払いへ進む',resume:'支払いを続ける',ticket:'チケットを表示',cancel:'申込を取り消す',full:'満席',paid:'支払いを確認しました。チケットが発行されました。',canceled:'支払いはキャンセルされました。Checkout の期限まで枠を確保します。',checked:'チェックイン済み',pending:'支払い待ち',privacy:'Google の氏名とメールは、申込・支払い照合・受付のためにのみ使用します。',notFound:'イベントが見つかりません。',error:'現在イベントを読み込めません。'}
}[lang];
const applyText={zh:['辦社群講座、工作坊或交流活動','社群主辦人可提出 3F 場地申請；送出申請不代表場地已保留。','填寫 3F 社群活動申請','企業／團隊包場請來信'],en:['Host a community talk, workshop or meetup','Community organizers may apply to use 3F. Submitting an application does not reserve the venue.','Apply for a 3F community event','Email about business or team hire'],ja:['コミュニティ講座、ワークショップ、交流会を開催','コミュニティ主催者は3Fの会場利用を申請できます。申請を送信しても会場は確保されません。','3Fコミュニティ活動の会場利用を申請','企業・チーム貸切を問い合わせる']}[lang];
document.getElementById('ev-apply-title').textContent=applyText[0];
document.getElementById('ev-apply-copy').textContent=applyText[1];
document.getElementById('ev-apply-link').textContent=applyText[2]+' →';
document.getElementById('ev-apply-link').href=base+'/event-application';
document.getElementById('ev-business-link').textContent=applyText[3]+' →';
document.getElementById('ev-apply').hidden=!!detailSlug();
const app=document.getElementById('ev-app');
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n>0?'NT$'+Number(n).toLocaleString('en-US'):T.free;
let toastTimer;
function toast(message){const el=document.getElementById('ev-toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200);}
async function api(path,{method='GET',body}={}){const res=await fetch('/api'+path,{method,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let data={};try{data=await res.json();}catch{}if(!res.ok)throw new Error(data.error||T.error);return data;}
function eventPath(e){return `${base}/events/${encodeURIComponent(e.slug||e.id)}`;}
function detailSlug(){const parts=location.pathname.split('/').filter(Boolean);if(parts[0]==='en'||parts[0]==='ja')parts.shift();return parts[0]==='events'&&parts[1]?decodeURIComponent(parts.slice(1).join('/')):'';}
function meta(e){const when=[e.starts_at,e.ends_at].filter(Boolean).join(' – ')||T.time;return `${esc(when)}<br>${esc(e.location||T.place)}`;}
function renderList(events){document.title=T.title+'｜言文字・Taiwan Talent Hub';app.innerHTML=`<section class="ev-hero"><div><p class="ev-kicker">emoji — Taiwan Talent Hub</p><h1 class="ev-h1">${T.title}</h1><p class="ev-intro">${T.intro}</p></div></section><section class="ev-grid">${events.length?events.map(e=>`<article class="ev-card"><a href="${eventPath(e)}"><span class="ev-pill">${T.public}</span><h2>${esc(e.title)}</h2><div class="ev-meta">${meta(e)}</div>${e.description?`<p class="ev-desc">${esc(e.description)}</p>`:''}<div class="ev-row"><span>${esc(T.capacity(e.reg_count,e.capacity))}</span><span class="ev-price">${money(e.price_twd)}</span></div><span class="ev-card__cta">${T.details} →</span></a></article>`).join(''):`<div class="ev-empty"><p>${T.empty}</p><a class="btn btn--ghost" href="https://www.instagram.com/emoji0701" target="_blank" rel="noopener">${T.follow} →</a></div>`}</section>`;}
function actionFor(e){
  const full=e.capacity>0&&e.reg_count>=e.capacity&&!e.registered&&e.registration_status!=='pending_payment';
  if(e.registered)return `<button class="btn btn--solid" id="ev-ticket">${T.ticket}</button>${e.price_twd===0&&!e.checked_in_at?`<button class="btn btn--ghost" id="ev-cancel">${T.cancel}</button>`:''}`;
  if(e.status!=='報名中')return `<button class="btn btn--ghost" disabled>${{zh:'目前不開放報名',en:'Registration is closed',ja:'申込受付は終了しました'}[lang]}</button>`;
  if(full)return `<button class="btn btn--ghost" disabled>${T.full}</button>`;
  if(!token){const redirect=encodeURIComponent(location.href);return `<a class="btn btn--solid" href="/auth/google?redirect=${redirect}">${T.login}</a>`;}
  const label=e.registration_status==='pending_payment'?T.resume:(e.price_twd>0?T.pay:T.register);
  return `<button class="btn btn--solid" id="ev-register">${label}</button>`;
}
function renderDetail(e){
  document.title=e.title+'｜'+T.title+'｜言文字';
  const status=e.checked_in_at?`<p class="ev-pill">${T.checked}</p>`:e.registration_status==='pending_payment'?`<p class="ev-pill private">${T.pending}</p>`:'';
  app.innerHTML=`<a class="ev-back" href="${base}/events">${T.back}</a><article class="ev-detail"><div class="ev-copy"><span class="ev-pill ${e.visibility==='private'?'private':''}">${e.visibility==='private'?T.private:T.public}</span><h1 class="ev-h1" style="font-size:clamp(2.1rem,5vw,4rem);margin-top:20px">${esc(e.title)}</h1><div class="ev-meta" style="font-size:1rem;margin-top:24px">${meta(e)}</div>${e.description?`<p class="ev-desc" style="margin-top:28px">${esc(e.description)}</p>`:''}</div><aside class="ev-side"><p class="ev-kicker">Ticket</p><div class="ev-row" style="margin-top:0;padding-top:0;border:0"><b>${esc(T.capacity(e.reg_count,e.capacity))}</b><span class="ev-price">${money(e.price_twd)}</span></div>${status}<div id="ev-actions">${actionFor(e)}</div><div class="ev-qr" id="ev-qr" hidden></div><p class="ev-note">${T.privacy}</p></aside></article>`;
  document.getElementById('ev-register')?.addEventListener('click',()=>register(e));
  document.getElementById('ev-ticket')?.addEventListener('click',()=>showTicket(e));
  document.getElementById('ev-cancel')?.addEventListener('click',()=>cancel(e));
}
async function register(e){const button=document.getElementById('ev-register');button.disabled=true;try{const out=await api('/events/'+encodeURIComponent(e.id)+'/register',{method:'POST',body:{lang}});if(out.url)location.href=out.url;else await loadDetail(e.slug);}catch(err){toast(err.message);button.disabled=false;}}
async function cancel(e){if(!confirm(T.cancel+'？'))return;try{await api('/events/'+encodeURIComponent(e.id)+'/register',{method:'DELETE'});await loadDetail(e.slug);}catch(err){toast(err.message);}}
async function showTicket(e){try{const out=await api('/events/'+encodeURIComponent(e.id)+'/ticket');const host=document.getElementById('ev-qr');host.hidden=false;host.innerHTML='<b>'+esc(e.title)+'</b><div id="ev-qr-img"></div><small>'+esc(e.checked_in_at?T.checked:'')+'</small>';if(!window.QRCode?.toDataURL)throw new Error('QR unavailable');window.QRCode.toDataURL(out.token,{width:220,margin:1},(err,url)=>{if(err)return toast(T.error);document.getElementById('ev-qr-img').innerHTML=`<img src="${url}" width="220" height="220" alt="Event ticket QR">`;});}catch(err){toast(err.message);}}
async function verifyReturn(){const q=new URLSearchParams(location.search);if(q.get('canceled')==='1')toast(T.canceled);if(q.get('paid')!=='1'||!q.get('s')||!token)return;try{const out=await api('/events/checkout/verify',{method:'POST',body:{session_id:q.get('s')}});if(out.paid)toast(T.paid);}catch(err){toast(err.message);}finally{history.replaceState(null,'',location.pathname);}}
async function loadDetail(slug){try{const {event}=await api('/events/'+encodeURIComponent(slug));renderDetail(event);}catch(err){app.innerHTML=`<div class="ev-empty">${esc(err.message||T.notFound)}</div>`;}}
async function main(){await verifyReturn();const slug=detailSlug();if(slug)return loadDetail(slug);try{renderList((await api('/events')).events||[]);}catch(err){app.innerHTML=`<div class="ev-empty">${esc(err.message)}</div>`;}}
main();
</script>
</body>
</html>
