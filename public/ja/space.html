<main id="content">

  </section>

  <div class="space-panel space-panel--accordion" id="floor-detail" hidden>

        <h2 class="space-panel__title" data-panel-title>在咖啡（at cafe）／三點水（3AM）</h2>

        <img src="" alt="">
      </figure>

        <h3 class="space-panel__menu-title" data-panel-menu-title>メニュー Menu</h3>
        <div data-panel-menu-body></div>
      </div>
    </div>
  </div>

<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/menu-lib.js"></script>
<script src="/space-dir.js"></script>
<script>
(function() {
  var htmlLang = (document.documentElement.getAttribute('lang') || 'zh').toLowerCase();
  var LANG = htmlLang.indexOf('en') === 0 ? 'en' : (htmlLang.indexOf('ja') === 0 ? 'ja' : 'zh');
  var FAIL_TEXT = { zh: '無法載入資料。', en: 'Could not load content.', ja: '読み込めませんでした。' }[LANG];
  var EMPTY_MENU = { zh: '目前尚未提供菜單資料。', en: 'Menu coming soon.', ja: 'メニュー準備中。' }[LANG];

  var dir = new SpaceDir({
    lang: LANG,
    root: document.getElementById('space-dir-root'),
    panel: document.getElementById('floor-detail'),
  });

  fetch('/api/public')
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var content = (d && d.content) || {};
      var hero = document.getElementById('media-hero');
      var heroUrl = String(content.space_hero_image || '').trim();
      if (hero && heroUrl) {
        hero.querySelector('img').src = heroUrl;
        hero.hidden = false;
      }
      var items = [];
      if (content.menu && window.MenuLib) {
        var doc = window.MenuLib.parseMenuDoc(content.menu);
        items = window.MenuLib.sortItems(window.MenuLib.publishedOnly(doc));
      }
      dir.setData(content, window.MenuLib.renderMenuHtml(items, LANG, EMPTY_MENU));
      dir.openFromHash();
    })
    .catch(function (err) {
      console.error(err);
      dir.setData({}, '<p class="menu-empty">' + FAIL_TEXT + '</p>');
    });

  window.addEventListener('hashchange', function () { dir.openFromHash(); });
})();
</script>
