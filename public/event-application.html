const groups=[[T.contactGroup,['community_name','contact_name','contact_email','contact_phone']],[T.eventGroup,['title','description','attendees']],[T.scheduleGroup,['starts_at','ends_at','requirements']]];
function field([name,type,max]){const optional=['contact_phone','requirements'].includes(name),wide=['community_name','title','description','requirements','attendees'].includes(name),label=name==='title'?T.titleField:T[name];const hint={description:T.descriptionHint,starts_at:T.timeHint,ends_at:T.timeHint,attendees:T.attendeesHint,requirements:T.requirementsHint}[name];const attrs=`id="ea-${name}" name="${name}"${optional?'':' required'}${max?` maxlength="${max}"`:''}${hint?` aria-describedby="hint-${name}"`:''}`;return `<div class="ea-field${wide?' ea-wide':''}"><label for="ea-${name}" id="ea-label-${name}">${label}</label>${type==='textarea'?`<textarea ${attrs} rows="${name==='description'?5:3}"></textarea>`:`<input ${attrs} type="${type}"${type==='number'?' min="1" max="10000" step="1"':''}${type==='datetime-local'?' step="60"':''}${name==='contact_email'?' autocomplete="email"':name==='contact_name'?' autocomplete="name"':name==='contact_phone'?' autocomplete="tel"':''}>`}${hint?`<small id="hint-${name}">${hint}</small>`:''}</div>`;}
function group([title,names],index){return `<section class="ea-step" aria-labelledby="ea-step-${index}"><h3 id="ea-step-${index}"><span class="ea-step__no">0${index+1}</span>${title}</h3><div class="ea-grid">${fields.filter(([name])=>names.includes(name)).map(field).join('')}</div></section>`;}
document.title=T.title+'｜言文字・Taiwan Talent Hub';
document.querySelector('meta[name="description"]').content=T.intro;
document.getElementById('content').innerHTML=`<a class="ea-back" href="${base}/events">${T.back}</a><section class="ea-hero"><div><span class="eyebrow" id="ea-eyebrow">${T.eyebrow}</span><h1 id="ea-title">${T.title}</h1></div><p id="ea-intro">${T.intro}</p></section><div class="ea-layout"><section class="ea-panel"><div id="ea-login" class="ea-login" hidden><h2>${T.loginTitle}</h2><p class="ea-note" id="ea-login-note">${T.loginText}</p><a id="ea-login-link" class="btn btn--solid" href="/auth/google?redirect=${encodeURIComponent(location.origin+base+'/event-application')}">${T.login}</a></div><h2>${T.form}</h2><p class="ea-note" style="margin-bottom:20px">${T.required}</p><form id="ea-form"><fieldset class="ea-fields" id="ea-fields"><legend class="ea-sr-only">${T.form}</legend><section class="ea-step ea-kind" aria-labelledby="ea-kind-title"><h3 id="ea-kind-title">${T.kindLabel}</h3><div class="ea-choice"><label><input type="radio" name="kind" value="community" checked>${T.kindCommunity}</label><label><input type="radio" name="kind" value="business">${T.kindBusiness}</label></div><div class="ea-venue" id="ea-venue" hidden><span class="ea-field-label">${T.venueLabel}</span><div class="ea-choice"><label><input type="radio" name="venue" value="2F">${T.venue2F}</label><label><input type="radio" name="venue" value="3F">${T.venue3F}</label></div><small>${T.venueHint}</small></div></section>${groups.map(group).join('')}<label class="ea-consent"><input type="checkbox" name="consent" required><span>${T.consent} <a href="${base}/events#notes" target="_blank" rel="noopener">${T.notesLink}</a>${T.consentEnd}</span></label></fieldset><p class="ea-note">${T.privacy}<a href="mailto:us@emoji.tw">us@emoji.tw</a>。</p><div id="ea-message" class="ea-message" role="status" aria-live="polite" hidden></div><div class="ea-actions" style="margin-top:24px"><button class="btn ea-submit" id="ea-submit" type="submit">${T.submit}</button><button class="btn btn--ghost" id="ea-clear" type="button">${T.clear}</button></div></form></section><aside class="ea-panel ea-aside"><h2 id="ea-scope-title">${T.scopeTitle}</h2><p id="ea-scope-text">${T.scopeText}</p><p class="ea-note">${T.rules}</p><p><a href="${base}/events#notes">${T.notesLink} →</a></p></aside></div><section class="ea-history" aria-labelledby="ea-history-title"><div class="ea-history-head"><h2 id="ea-history-title">${T.history}</h2><button class="btn btn--ghost" id="ea-refresh" type="button">${T.refresh}</button></div><div id="ea-applications" aria-live="polite"></div></section>`;
const form=document.getElementById('ea-form'),fieldset=document.getElementById('ea-fields'),submit=document.getElementById('ea-submit'),applications=document.getElementById('ea-applications');
function message(text){const el=document.getElementById('ea-message');el.textContent=text;el.hidden=!text;}
function saveDraft(){try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(draft));return true;}catch{storageReady=false;message(T.draftError);syncControls();return false;}}
function radios(name){return form.querySelectorAll?[...form.querySelectorAll('input[name="'+name+'"]')]:[];}
function currentKind(){return form.elements.kind&&form.elements.kind.value==='business'?'business':'community';}
function setRadio(name,value){for(const r of radios(name))r.checked=r.value===value;}
// 依申請類型切換文案與包場空間欄位
function applyKind(kind){const biz=kind==='business';const t=(id,text)=>{const el=document.getElementById(id);if(el)el.textContent=text;};t('ea-title',biz?T.titleBiz:T.title);t('ea-eyebrow',biz?T.eyebrowBiz:T.eyebrow);t('ea-intro',biz?T.introBiz:T.intro);t('ea-scope-title',biz?T.scopeTitleBiz:T.scopeTitle);t('ea-scope-text',biz?T.scopeTextBiz:T.scopeText);t('ea-label-community_name',biz?T.orgBiz:T.community_name);const v=document.getElementById('ea-venue');if(v)v.hidden=!biz;for(const r of radios('venue'))r.required=biz;document.title=(biz?T.titleBiz:T.title)+'｜言文字・Taiwan Talent Hub';}
function values(){const out=Object.fromEntries(new FormData(form));for(const [name] of fields)out[name]=String(out[name]||'').trim();out.attendees=Number(out.attendees);out.consent=form.elements.consent.checked;out.kind=currentKind();out.venue=out.kind==='business'?String((form.elements.venue&&form.elements.venue.value)||''):'3F';return out;}
function restore(){for(const [name] of fields)form.elements[name].value=draft.fields?.[name]??'';form.elements.consent.checked=draft.fields?.consent===true;const kind=draft.fields?.kind||(new URLSearchParams(location.search).get('kind')==='business'?'business':'community');setRadio('kind',kind);if(draft.fields?.venue)setRadio('venue',draft.fields.venue);applyKind(kind);}
// 草稿的帳號比對僅供介面防止誤送；授權仍由伺服器驗證。
function tokenSubject(){try{const sub=JSON.parse(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).sub;return typeof sub==='string'?sub:'';}catch{return '';}}
function differentAccount(){return !!draft.pending&&!!token&&(!draft.sub||draft.sub!==tokenSubject());}
function syncControls(){const mismatch=differentAccount();fieldset.disabled=sending||!!draft.pending;submit.disabled=sending||!token||!storageReady||mismatch;submit.textContent=sending?T.submitting:draft.pending?T.retry:T.submit;document.getElementById('ea-clear').disabled=sending;document.getElementById('ea-login').hidden=!!token&&!mismatch;if(mismatch)document.getElementById('ea-login-note').textContent=T.accountMismatch;else if(token)document.getElementById('ea-login-note').textContent=T.loginText;document.getElementById('ea-refresh').hidden=!token;}
function expired(){token='';try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem('tth_name');}catch{}document.getElementById('ea-login-note').textContent=T.expired;applications.textContent=T.historyLogin;syncControls();}
async function api(path,body){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);try{const response=await fetch(path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal});let data={};try{data=await response.json();}catch{}if(!response.ok){const err=new Error(data.error||T.genericError);err.status=response.status;if(response.status===401)expired();throw err;}return data;}finally{clearTimeout(timeout);}}
function when(value){if(!value)return '';const normalized=/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(value)?value+':00+08:00':value;const date=new Date(normalized);return Number.isNaN(date.getTime())?value:new Intl.DateTimeFormat(lang==='zh'?'zh-TW':lang==='ja'?'ja-JP':'en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date);}
function renderApplications(items){applications.innerHTML=items.length?items.map(a=>`<article class="ea-record"><span class="ea-status">${esc(T[a.status]||a.status)}</span><h3>${esc(a.title)}</h3><p>${a.kind==='business'?esc(T.kindBusiness)+' · '+esc(a.venue==='2F'?T.venue2F:T.venue3F):esc(T.kindCommunity)}</p><p>${esc(a.community_name)} · ${T.people} ${esc(a.attendees)}</p><p>${esc(when(a.starts_at))} – ${esc(when(a.ends_at))} · UTC+8</p><div class="ea-review"><strong>${T.review}</strong><p>${esc(a.review_note||T.noReview)}</p></div><details><summary>${T.details}</summary><p>${esc(a.description)}</p>${a.requirements?`<p>${esc(T.requirements)}：${esc(a.requirements)}</p>`:''}<p>${esc(a.contact_name)} · ${esc(a.contact_email)}${a.contact_phone?' · '+esc(a.contact_phone):''}</p><p class="ea-note">${T.reference}：${esc(a.id)}</p></details></article>`).join(''):`<p class="ea-note">${T.empty}</p>`;}
async function loadApplications(){if(!token){applications.textContent=T.historyLogin;return;}const refresh=document.getElementById('ea-refresh');refresh.disabled=true;applications.textContent=T.loading;try{const data=await api('/api/me/event-applications');if(!Array.isArray(data.applications))throw new Error(T.historyError);renderApplications(data.applications);}catch(err){applications.textContent=err.status===401?T.historyLogin:T.historyError;}finally{refresh.disabled=false;}}
form.addEventListener('input',()=>{for(const [name] of fields)form.elements[name].setCustomValidity('');applyKind(currentKind());draft.fields=values();saveDraft();});
form.addEventListener('submit',async event=>{event.preventDefault();if(sending||!token||!storageReady)return;if(differentAccount()){message(T.accountMismatch);syncControls();return;}let body=draft.pending;if(!body){for(const [name,type] of fields){const input=form.elements[name];input.setCustomValidity(input.required&&type!=='number'&&!input.value.trim()?T.blank:'');}if(form.elements.starts_at.value&&Date.parse(form.elements.starts_at.value+':00+08:00')<=Date.now())form.elements.starts_at.setCustomValidity(T.future);if(form.elements.ends_at.value<=form.elements.starts_at.value)form.elements.ends_at.setCustomValidity(T.endAfter);if(!form.reportValidity())return;if(currentKind()==='business'&&!(form.elements.venue&&form.elements.venue.value)){message(T.venueRequired);return;}draft.fields=values();draft.request_id=draft.request_id||crypto.randomUUID();body={request_id:draft.request_id,...draft.fields};draft.sub=tokenSubject();if(!draft.sub){expired();message(T.expired);return;}draft.pending=body;if(!saveDraft())return;}sending=true;syncControls();message('');try{const data=await api('/api/event-applications',body);if(data.ok!==true||!data.application?.id)throw new Error(T.unconfirmed);draft={};try{sessionStorage.removeItem(DRAFT_KEY);}catch{}form.reset();message(`${T.success} ${T.reference}: ${data.application.id}`);await loadApplications();}catch(err){if(err.status&&err.status<500&&err.status!==401&&err.status!==409){delete draft.pending;saveDraft();message(T.requestError+err.message);}else{message(err.status===401?T.expired:err.status===409?T.requestError+err.message:T.unconfirmed);if(err.status===409)await loadApplications();}}finally{sending=false;syncControls();}});
document.getElementById('ea-clear').addEventListener('click',()=>{if(!confirm(T.clearConfirm))return;draft={};try{sessionStorage.removeItem(DRAFT_KEY);}catch{}form.reset();for(const [name] of fields)form.elements[name].setCustomValidity('');message('');syncControls();});
document.getElementById('ea-refresh').addEventListener('click',loadApplications);
restore();syncControls();if(!storageReady)message(T.draftError);else if(differentAccount())message(T.accountMismatch);else if(draft.pending)message(T.unconfirmed);loadApplications();
</script>
</body>
</html>
